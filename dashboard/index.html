    var tr = records.tree || {};
    if (key && key.indexOf("proj:") === 0) return (tr.projects || {})[key.slice(5)] || [];
    return (tr.notes || {})[key] || [];
  }
  function recFirstFile(key) { var f = recFilesOf(key); return f.length ? f[0].path : null; }
  // 폴더 키 → 사람이 읽는 출처 라벨 (최근·리딩 페인 메타)
  function recSrcLabel(key) {
    if (!key) return "";
    if (key.indexOf("proj:") === 0) return "프로젝트 · " + key.slice(5).replace(/^\d{4}-\d{2}-/, "");
    return FOLDER_LABEL[key] || key;
  }

  // ── 간단 마크다운 렌더러 (제목·목록·굵게·인라인코드·코드블록·표) ──
  // ── 위키 내부 링크 ─────────────────────────────────────────
  // 본문에 적힌 파일 경로는 지금까지 **죽은 텍스트**였다(노션·옵시디언과의 결정적 차이).
  // 이것을 눌러 열리는 링크로 바꾼다. '파일로 이동'(한 번도 동작한 적 없는 앵커)의 대체재다.
  //   인식 대상: notes/... 전체 경로 · 같은 프로젝트 폴더의 형제 파일명(00-계획.md 같은 상대 표기)
  // 실제로 존재하는 경로만 링크로 만든다 — 없는 파일을 링크처럼 보이게 하지 않는다(정직).
  var _pathIndex = null;
  function pathIndex() {
    if (_pathIndex) return _pathIndex;
    var byPath = {}, byBase = {};
    allRecords().forEach(function (f) {
      if (!f.path) return;
      byPath[f.path] = 1;
      var b = basename(f.path);
      (byBase[b] = byBase[b] || []).push(f.path);
    });
    Object.keys(contentByPath).forEach(function (p) {
      if (byPath[p]) return;
      byPath[p] = 1;
      var b = basename(p);
      (byBase[b] = byBase[b] || []).push(p);
    });
    _pathIndex = { byPath: byPath, byBase: byBase };
    return _pathIndex;
  }
  // 표기 → 실제 경로. baseDir 이 있으면 형제 파일명을 그 폴더에서 먼저 찾는다(중복 파일명 오연결 방지).
  function resolveInternal(raw, baseDir) {
    if (!raw) return null;
    var t = String(raw).replace(/^\.\//, "").replace(/[)\],.]+$/, "").trim();
    var ix = pathIndex();
    if (ix.byPath[t]) return t;
    if (baseDir) {
      var sib = baseDir.replace(/\/$/, "") + "/" + t;
      if (ix.byPath[sib]) return sib;
    }
    var cands = ix.byBase[basename(t)];
    if (cands && cands.length === 1) return cands[0];
    if (cands && baseDir) {
      for (var i = 0; i < cands.length; i++) if (cands[i].indexOf(baseDir) === 0) return cands[i];
    }
    return null;
  }
  function dirOf(p) { var a = String(p || "").split("/"); a.pop(); return a.join("/"); }
  // 인라인 텍스트(이미 esc 된 HTML 조각) 안의 경로 표기를 링크로 바꾼다.
  var INLINK_RE = /((?:notes\/)?[\w가-힣._-]+(?:\/[\w가-힣._-]+)*\.(?:md|csv|xlsx))/g;
  function linkifyPaths(escapedHtml, baseDir) {
    return String(escapedHtml).replace(INLINK_RE, function (m) {
      var hit = resolveInternal(m, baseDir);
      if (!hit) return m;
      return '<button class="inlink" type="button" data-inlink="' + esc(hit) + '" title="' + esc(hit) + '">' +
        m + '</button>';
    });
  }

  // collect(선택): 목차용으로 헤딩을 담아 보낸다 — [{lv, text, id}]. 헤딩엔 앵커 id 를 붙인다.
  // baseDir(선택): 형제 파일명(00-계획.md)을 풀 기준 폴더. 내부 링크 변환에 쓴다.
  function renderMarkdown(src, collect, baseDir) {
    var lines = String(src || "").replace(/\r\n/g, "\n").split("\n"), out = [], i = 0, hn = 0;
    function inl(t) {
      t = esc(t);
      t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      // 코드 조각을 자리표시자로 빼 둔다 — 그러지 않으면 경로 링크화가 **자기가 만든 마크업의
      // data-inlink 속성값을 다시 훑어** 태그를 깨뜨린다(실측 결함: 링크 대상이 '<button class=' 이 됨).
      var codes = [];
      t = t.replace(/`([^`]+)`/g, function (_m, inner) {
        codes.push(inner);
        return "@@C" + (codes.length - 1) + "@@";   // @ 는 경로 문자 집합에 없어 링크 정규식에 안 걸린다
      });
      t = linkifyPaths(t, baseDir);
      // 링크: [텍스트](http…) + 맨몸 URL — 클릭하면 웹뷰 모달로 열린다 (뷰어 위임 리스너)
      t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
      t = t.replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
      // 코드 조각 복원 — 산출물 헤더가 `00-계획.md` 처럼 백틱으로 쓰므로 그 안도 링크로 만든다
      t = t.replace(/@@C(\d+)@@/g, function (_m, n) {
        return "<code>" + linkifyPaths(codes[+n], baseDir) + "</code>";
      });
      return t;
    }
    while (i < lines.length) {
      var ln = lines[i];
      if (/^```/.test(ln)) { var buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; } i++; out.push('<pre class="md-pre"><code>' + esc(buf.join("\n")) + "</code></pre>"); continue; }
      var h = ln.match(/^(#{1,6})\s+(.*)$/);
      if (h) {
        var lv = h[1].length, hid = "mdh-" + (++hn);
        if (collect) collect.push({ lv: lv, text: h[2].replace(/[*`]/g, "").trim(), id: hid });
        out.push("<h" + lv + ' class="md-h md-h' + lv + '" id="' + hid + '">' + inl(h[2]) + "</h" + lv + ">");
        i++; continue;
      }
      if (/^\s*\|.*\|\s*$/.test(ln) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
        var head = ln.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(function (c) { return c.trim(); });
        i += 2; var rows = [];
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rows.push(lines[i].trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(function (c) { return c.trim(); })); i++; }
        out.push('<table class="md-table"><thead><tr>' + head.map(function (c) { return "<th>" + inl(c) + "</th>"; }).join("") + "</tr></thead><tbody>" +
          rows.map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + inl(c) + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table>"); continue;
      }
      if (/^\s*[-*]\s+/.test(ln)) { var ui = []; while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { ui.push("<li>" + inl(lines[i].replace(/^\s*[-*]\s+/, "")) + "</li>"); i++; } out.push('<ul class="md-ul">' + ui.join("") + "</ul>"); continue; }
      if (/^\s*\d+\.\s+/.test(ln)) { var oi = []; while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) { oi.push("<li>" + inl(lines[i].replace(/^\s*\d+\.\s+/, "")) + "</li>"); i++; } out.push('<ol class="md-ol">' + oi.join("") + "</ol>"); continue; }
      if (/^\s*$/.test(ln)) { i++; continue; }
      out.push('<p class="md-p">' + inl(ln) + "</p>"); i++;
    }
    return out.join("");
  }

  // ── todo 버킷/정렬 ─────────────────────────────────────────
  // 기한 판정은 대시보드가 due 로 직접 계산한다 — 파생 state("overdue")를 신뢰하지 않는다.
  // 파생 판정일과 표시 기준일이 어긋나면 "0일 지남"·미래 기한 '지남' 오표기가 났다(W20 P0 결함).
  // refresh-dashboard.sh 도 같은 기준(status.today.date)으로 파생하도록 고쳤지만,
  // 옛 래퍼 파일(기준이 어긋난 채 생성된 것)을 읽어도 화면이 옳게 나오도록 여기서 다시 계산한다.
  function bucket(t) {

    if (d === null) return "later"; // 기한 없는 열린 이슈 = 상시
    if (d < 0) return "past";
    if (d === 0) return "today";
    return "later";
  }
  function rank(t) {
    var b = bucket(t);
    if (b === "past") return 0;
    if (b === "today") return 1;
    if (t.kind === "issue" && !t.due) return 2; // 열린 이슈
    return 3 + (dayDiff(t.due) || 0) / 100;
  }
  function ddayLabel(t) {
    var b = bucket(t), d = dayDiff(t.due);
    if (b === "past") return { cls: "overdue", txt: (d !== null ? Math.abs(d) + "일 지남" : "지남") };
    if (b === "today") return { cls: "today", txt: "오늘 마감" };
    if (t.due) return { cls: "", txt: "D-" + d };
    return { cls: "", txt: "상시" };
  }
  function countBucket(b) { return activeTodos.filter(function (t) { return bucket(t) === b; }).length; }

  var overdueN = countBucket("past");
  var todayN = countBucket("today");
  var laterN = countBucket("later");

  // ── 칸반 카드 구성 ─────────────────────────────────────────
  //  대기(예정/이슈) · 진행 중(지난+오늘 todo + 멤버 working) · 완료(오늘 마무리 — 없음: 긍정 빈 상태)
  function kanbanModel() {
    var waiting = [], doing = [], done = [];
    todos.forEach(function (t, i) {
      var card = { type: "todo", idx: i, t: t };
      if (t.state === "done") { done.push(card); return; } // 오늘 완료된 할 일 → 완료 열
      if (bucket(t) === "later") waiting.push(card);
      else doing.push(card); // past + today = 지금 흐름
    });
    ((proj && proj.members) || []).forEach(function (m, i) {
      var card = { type: "member", idx: i, m: m };
      if (m.status === "working") doing.push(card);
      else if (m.status === "done") done.push(card); // 완료된 멤버 작업 → 완료 열
      else if (m.status === "waiting") waiting.push(card);
    });
    // 데이터 기반 — done 이 비면(오늘 완료 0건) 렌더 단계에서만 긍정 빈 상태 노출
    return { waiting: waiting, doing: doing, done: done };
  }

  // ============================================================
  // 렌더 조각
  // ============================================================
  function sidebarHTML() {
    var km = kanbanModel();
    var badges = {
      todos: String(activeTodos.length),
      project: String(projectList.length),
      team: staffList.length ? String(staffList.length) : "",
      kanban: String(km.waiting.length + km.doing.length + km.done.length),
      records: String(Object.keys(records.counts || {}).reduce(function (a, k) { return a + (records.counts[k] || 0); }, 0))
    };
    var st = ({ online: "online", working: "working", idle: "idle" })[agent.status] || "offline";
    var sub = !agent.identityLoaded ? "정체성 미입력"

    var nav = TABS.map(function (tb) {
      var sel = tb.id === activeTab;

        var warn = proj && proj.health === "주의";

      } else {

        ' aria-selected="' + (sel ? "true" : "false") + '" aria-controls="panel-' + tb.id + '"' +
        (sel ? ' aria-current="page"' : '') + '>' +
        '<span class="ic" aria-hidden="true">' + tb.ic + '</span>' +

    return '<aside class="sidebar">' +

        '<span class="biz">' + esc(agent.businessName || "정체성 미입력") +
          '<small>' + esc(sub) + '</small>' +
        '</span>' +
      '</div>' +
      '<button class="searchbtn" data-cmdk-open type="button" aria-label="검색 열기 (⌘K)">' +
        '<span class="cmdk-ic" aria-hidden="true">⌕</span><span class="lbl">검색</span>' +
        '<kbd class="kbd">' + (isMac ? '⌘K' : 'Ctrl K') + '</kbd></button>' +
      '<nav class="nav" role="tablist" aria-orientation="vertical" aria-label="대시보드 탭">' + nav + '</nav>' +
      '<div class="side-foot">' +
        '<span class="upd-label">갱신 ' + relTime(s.updatedAt) + '</span><span class="spacer"></span>' +
        themeBtn() +
        '<button class="refresh" data-refresh type="button" aria-label="새로고침">' +
          '<span class="ico" aria-hidden="true">↻</span>새로고침</button>' +

  // 테마 토글 — 기본 라이트, 버튼으로 다크 전환, 선택은 localStorage 기억
  var themePrefs = (typeof G !== "undefined" && G.prefs) ? G.prefs() : null;
  function curTheme() {
    var a = document.documentElement.getAttribute("data-theme");
    if (a === "dark" || a === "light") return a;
    return (typeof matchMedia !== "undefined" && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  }
  function themeBtn() {
    var dark = curTheme() === "dark";
    return '<button class="refresh" data-theme-toggle type="button" aria-label="' +
      (dark ? "라이트 모드로 전환" : "다크 모드로 전환") + '" title="' + (dark ? "라이트 모드" : "다크 모드") + '">' +
      '<span class="ico" aria-hidden="true">' + (dark ? "☀" : "☾") + '</span></button>';

  // 펼침 리스트 행 (할 일)
  // 일치 강조 — hl() 은 cmdk 전용(.cmdk-hit). 목록·본문 공용은 이쪽. **평문에만** 쓴다(HTML 에 씌우면 태그가 깨진다).
  function hlm(text, terms) {
    var out = esc(String(text == null ? "" : text));
    (terms || []).forEach(function (tm) {
      if (!tm) return;
      var re = new RegExp("(" + String(tm).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");

    });
    return out;
  }
  function todoRow(t, gi, terms) {
    var id = "todo-" + gi;
    var dd = ddayLabel(t);

    return '<li class="todo' + open + (t.state === "done" ? " is-done" : "") + '">' +
      '<button class="todo-row" type="button" data-exp="' + id + '" aria-expanded="' + (openSet[id] ? "true" : "false") + '" aria-controls="' + id + '">' +
        '<span class="kind ' + esc(t.kind) + '">' + esc(KIND_LABEL[t.kind] || t.kind) + '</span>' +
        '<span class="todo-title">' + ov + ((terms && terms.length) ? hlm(t.title, terms) : esc(t.title)) + '</span>' +
        '<span class="todo-meta ' + dd.cls + '">' + esc(dd.txt) + '</span>' +
        '<span class="chev" aria-hidden="true">›</span>' +
      '</button>' +
      '<div class="todo-detail" id="' + id + '"><div class="todo-detail-inner">' +
        '<div class="detail-box">' + esc(kindHint(t)) +
          // 원본 본문을 그 자리에서 보여준다 — 기록 탭의 리딩 문법과 통일(경로만 던지지 않는다)
          (function () {
            if (!t.source) return '<div class="snip empty-snip">연결된 원본 노트가 없어요.</div>';
            var sn = bodySnippet(t.source, 220);
            return sn ? '<div class="snip">' + esc(sn) + '</div>'
              : '<div class="snip empty-snip">이 파일은 미리보기가 준비되지 않았어요 — ‘파일로 이동’ 으로 원본을 여세요.</div>';
          })() +
          '<div class="src"><code>' + esc(t.source || "") + '</code></div>' +
          // 교차 연결: 같은 원본을 참조하는 프로젝트·형제 산출물 (역방향 링크는 폴더 구조로 표현되지 않는다)
          (function () {
            if (!t.source) return "";

            var sib = siblingsOf(t.source);
            if (!bl.length && !sib.length) return "";
            var chips = bl.map(function (x) {
              return '<button class="xlink" type="button" data-project-open="' + esc(x.v) + '">' +
                '<span class="ic" aria-hidden="true">◐</span><span class="tx">' + esc(x.t) + '</span></button>';
            }).concat(sib.map(function (f) {
              return '<button class="xlink" type="button" data-viewer="' + esc(f.path) + '">' +
                '<span class="ic" aria-hidden="true">▤</span><span class="tx">' + esc(f.title || basename(f.path)) + '</span></button>';
            })).join("");
            return '<div class="xlink-h">관련</div><div class="xlinks">' + chips + '</div>';
          })() +
          '<div class="acts" style="margin-top:var(--g-space-3)">' +
            (t.source ? '<button class="g-btn g-btn--soft g-btn--sm" type="button" data-viewer="' + esc(t.source) + '">전체 보기</button>' : '') +
            '<button class="g-btn g-btn--secondary g-btn--sm" type="button" data-copy="' + esc(t.source || "") + '" aria-label="경로 복사">⧉ 복사</button>' +
          '</div>' +
          // 보기만 하고 끝나던 목록에 **행동**을 붙인다 — 할 일이 끝나야 목록이 목록으로 산다
          partnerActions("파트너에게 시키기", [
            { id: "todo.draft", arg: String(gi), label: "답장 초안", ic: "✎" },
            { id: "todo.context", arg: String(gi), label: "지난 맥락 찾기", ic: "⌕" },
            { id: "todo.done", arg: String(gi), label: "완료 처리", ic: "✓" },
            { id: "todo.defer", arg: String(gi), label: "내일로", ic: "→" }
          ]) +
        '</div>' +
      '</div></div>' +
    '</li>';
  }
  function kindHint(t) {
    if (t.kind === "issue") return "고객/운영 이슈예요. 방침을 정해 회신·조치하면 닫혀요.";
    if (bucket(t) === "past") return "기한이 지났어요. 오늘 가장 먼저 확인하면 좋아요.";
    return "리마인더예요. 아래 원본 노트에서 자세한 맥락을 볼 수 있어요.";
  }

  // ============================================================
  // W20 2단계 · 시각화 프리미티브 + 파생 지표
  // ------------------------------------------------------------
  // 정직 규율: 데이터에 없는 추이·델타는 만들지 않는다. 아래 파생은 전부 실데이터에서 나온다.
  //   · 기록 일별 건수 → records.tree/projects/recent 의 date (실제 파일 날짜)
  //   · 활동 시각 분포 → status.today.activities[].time
  //   · 기한 분포·시간축 → todos[].due
  // 활동의 "어제 대비" 는 상태 파일에 어제 활동이 없으므로 만들지 않는다(허위 델타 금지).
  // ============================================================

  // 전 기록 색인 (경로 중복 제거) — 히트맵·스파크라인·백링크의 공용 원천
  var _allRec = null;
  function allRecords() {
    if (_allRec) return _allRec;
    var out = [], seen = {};
    function push(f, fk) {
      if (!f || !f.path || seen[f.path]) return;
      seen[f.path] = 1;
      out.push({ path: f.path, title: f.title, date: f.date, kind: f.kind, fk: fk });
    }
    var tr = records.tree || {}, tn = tr.notes || {}, tp = tr.projects || {};
    REC_ORDER.forEach(function (k) { (tn[k] || []).forEach(function (f) { push(f, k); }); });
    Object.keys(tp).forEach(function (sl) { (tp[sl] || []).forEach(function (f) { push(f, "proj:" + sl); }); });
    (records.recent || []).forEach(function (f) { push(f, recFolderKeyOf(f.path)); });
    (records.projects || []).forEach(function (f) { push(f, "proj:" + (projectSlug(f.path) || "")); });
    _allRec = out;
    return out;
  }

  function isoShift(iso, days) {
    var d = parseD(iso); if (!d) return null;
    d.setDate(d.getDate() + days);
    function z(n) { return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate());
  }
  var WD = ["일", "월", "화", "수", "목", "금", "토"];

  // 기록 지평선 — 기준일(status.today.date)과 **가장 최근 기록 날짜** 중 늦은 쪽.
  // 노트는 기준일보다 나중 날짜일 수 있다(에이전트가 상태를 갱신하기 전에 기록만 쌓인 경우).
  // 기준일에서 끊으면 KPI 총계(19)와 추이 합계(17)가 어긋나 같은 화면에 두 숫자가 생긴다(실측 결함).
  var _recEnd = null;
  function recEndIso() {
    if (_recEnd) return _recEnd;
    var mx = TODAY;
    allRecords().forEach(function (f) {
      var d = String(f.date || "").split("T")[0];
      if (d.length === 10 && d > mx) mx = d;
    });
    _recEnd = mx;
    return mx;
  }

  // 지평선 이전 nDays 일의 일별 기록 수 (마지막 원소 = 지평선 날짜)
  // notesOnly: 홈의 '쌓인 기록' 값은 records.counts(노트 5분류) 이므로 추이·델타도 같은 모집단으로 센다.
  //   섞으면 값 19 / 델타 28 처럼 같은 화면에서 두 개의 '기록 수' 가 나와 신뢰가 깨진다(실측 결함).
  function recDayCounts(nDays, notesOnly) {
    var byDay = {};
    allRecords().forEach(function (f) {
      if (notesOnly && String(f.fk || "").indexOf("proj:") === 0) return;
      var d = String(f.date || "").split("T")[0];
      if (d.length === 10) byDay[d] = (byDay[d] || 0) + 1;
    });
    var out = [], endIso = recEndIso();
    for (var i = nDays - 1; i >= 0; i--) {
      var iso = isoShift(endIso, -i);
      out.push({ iso: iso, n: byDay[iso] || 0 });
    }
    return out;
  }

  // 마이크로 막대: 분포를 KPI 칩 안에 넣는다 (단일 계열 → 범례 없음)
  function mbarsHTML(items, opt) {
    opt = opt || {};
    var max = 0;
    items.forEach(function (it) { if (it.n > max) max = it.n; });
    var bars = items.map(function (it) {
      var h = max > 0 ? Math.max(it.n > 0 ? 3 : 2, Math.round((it.n / max) * 22)) : 2;
      var cls = "mbar" + (it.n === 0 ? " zero" : (it.warn ? " warnb" : ""));
      return '<span class="' + cls + '" style="height:' + h + 'px" data-tip="' + esc(it.tip) + '"></span>';
    }).join("");
    var axis = opt.axis
      ? '<span class="mb-axis">' + items.map(function (it) { return "<span>" + esc(it.ax || "") + "</span>"; }).join("") + "</span>"
      : "";
    // data-viz: 어떤 분포인지 식별하는 안정 훅 (회귀 스위트가 '첫 번째 차트' 로 잘못 집는 것을 막는다)
    return '<span class="kpi-viz"' + (opt.id ? ' data-viz="' + esc(opt.id) + '"' : '') +
      ' role="img" aria-label="' + esc(opt.label || "분포") + '">' +
      '<span class="mbars">' + bars + '</span>' + axis + '</span>';
  }

  // 스파크라인: 2px 선 + 10% 면 + 끝점 마커(서피스 링). 3점 미만이면 그리지 않는다.
  function sparkHTML(series, opt) {
    opt = opt || {};
    if (!series || series.length < 3) return "";
    var W = 100, H = 26, PAD = 3;
    var max = 0;
    series.forEach(function (p) { if (p.n > max) max = p.n; });
    if (max <= 0) max = 1;
    var step = (W - PAD * 2) / (series.length - 1);
    var pts = series.map(function (p, i) {
      var x = PAD + i * step;
      var y = H - PAD - (p.n / max) * (H - PAD * 2);
      return [Math.round(x * 10) / 10, Math.round(y * 10) / 10];
    });
    var dLine = pts.map(function (p, i) { return (i ? "L" : "M") + p[0] + " " + p[1]; }).join(" ");
    var dArea = dLine + " L" + pts[pts.length - 1][0] + " " + (H - PAD) + " L" + pts[0][0] + " " + (H - PAD) + " Z";
    var last = pts[pts.length - 1];
    return '<span class="kpi-viz"' + (opt.id ? ' data-viz="' + esc(opt.id) + '"' : '') + '><svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none"' +
      ' role="img" aria-label="' + esc(opt.label || "추이") + '">' +
      '<path class="ar" d="' + dArea + '"/><path class="ln" d="' + dLine + '"/>' +
      '<circle class="dt" cx="' + last[0] + '" cy="' + last[1] + '" r="2.6"/></svg></span>';
  }

  // 단계 분절 미터 — 순서 있는 칸(진행률 아님). 현재 단계는 진한 칸으로 한 칸만.
  function pmeterHTML(phases, curIdx, done) {
    if (!phases || !phases.length) return "";
    var segs = phases.map(function (nm, i) {
      var cls = done ? "on" : (curIdx >= 0 && i < curIdx ? "on" : (i === curIdx ? "cur" : ""));
      var state = done ? "완료" : (i === curIdx ? "진행 중" : (curIdx >= 0 && i < curIdx ? "지남" : "예정"));
      return '<i class="' + cls + '" data-tip="' + esc((i + 1) + ". " + nm + " · " + state) + '"></i>';
    }).join("");
    var lbl = done ? phases.length + "/" + phases.length + " 단계 완료"
      : (curIdx >= 0 ? (curIdx + 1) + "/" + phases.length + " 단계 · " + phases[curIdx] : phases.length + "단계");
    return '<span class="pmeter" role="img" aria-label="' + esc(lbl) + '">' + segs + '</span>' +
      '<span class="pmeter-lbl">' + esc(lbl) + '</span>';
  }

  // 델타: 최근 half 대 그 직전 half 의 실측 차이. 데이터가 부족하면 표시하지 않는다.
  function deltaHTML(series, half, periodLabel) {
    if (!series || series.length < half * 2) return "";
    var cur = 0, prev = 0, i;
    for (i = series.length - half; i < series.length; i++) cur += series[i].n;
    for (i = series.length - half * 2; i < series.length - half; i++) prev += series[i].n;
    var d = cur - prev;
    var cls = d > 0 ? "up" : d < 0 ? "down" : "flat";
    var sign = d > 0 ? "▲" : d < 0 ? "▼" : "—";
    var txt = d === 0 ? "변화 없음" : Math.abs(d) + "건";
    return ' <span class="kpi-delta ' + cls + '" title="' + esc(periodLabel) + '">' + sign + " " + esc(txt) + "</span>";
  }

  // 히트맵: 기준일까지 주 단위 열 × 요일 행. 순차 스케일 = 한 색조 4단계(색 리터럴 0 — color-mix).
  function heatHTML(weeks, notesOnly) {
    var days = weeks * 7;
    var endIso = recEndIso();                  // 기준일과 최신 기록일 중 늦은 쪽 (KPI 총계와 합계를 일치시킨다)
    var end = parseD(endIso);
    if (!end) return "";
    var pad = end.getDay();                    // 마지막 주에서 지평선 이후 칸은 비운다
    var series = recDayCounts(days + pad, notesOnly);
    var byIso = {}; series.forEach(function (p) { byIso[p.iso] = p.n; });
    var max = 0; series.forEach(function (p) { if (p.n > max) max = p.n; });
    // 시작일을 일요일에 맞춘다
    var startD = parseD(isoShift(endIso, -(days - 1)));
    while (startD.getDay() !== 0) { startD.setDate(startD.getDate() - 1); }
    function z(n) { return (n < 10 ? "0" : "") + n; }
    function isoOf(d) { return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate()); }

    var cols = [], cur = new Date(startD.getTime()), total = 0, best = null;
    var endT = end.getTime();
    while (cur.getTime() <= endT) {
      var col = [];
      for (var w = 0; w < 7; w++) {
        var iso = isoOf(cur);
        if (cur.getTime() > endT) { col.push({ voidCell: true }); }
        else {
          var n = byIso[iso] || 0;
          total += n;
          if (!best || n > best.n) best = { iso: iso, n: n };
          col.push({ iso: iso, n: n, isToday: iso === TODAY });
        }
        cur.setDate(cur.getDate() + 1);
      }
      cols.push(col);
    }
    function lv(n) { if (!n) return ""; if (max <= 1) return " l4"; var r = n / max; return r > .75 ? " l4" : r > .5 ? " l3" : r > .25 ? " l2" : " l1"; }
    var grid = cols.map(function (col) {
      return '<span class="heat-col">' + col.map(function (c) {
        if (c.voidCell) return '<span class="heat-c void" aria-hidden="true"></span>';
        var p = c.iso.split("-");
        var tip = (+p[1]) + "월 " + (+p[2]) + "일 · 기록 " + c.n + "건";
        return '<span class="heat-c' + lv(c.n) + (c.isToday ? " today" : "") + '" data-tip="' + esc(tip) + '" aria-label="' + esc(tip) + '"></span>';
      }).join("") + '</span>';
    }).join("");
    var dayCol = '<span class="heat-days" aria-hidden="true">' +
      WD.map(function (d, i) { return "<span>" + (i % 2 === 1 ? d : "") + "</span>"; }).join("") + '</span>';
    var legend = '<div class="heat-legend"><span>적음</span>' +
      '<span class="heat-c"></span><span class="heat-c l1"></span><span class="heat-c l2"></span><span class="heat-c l3"></span><span class="heat-c l4"></span>' +
      '<span>많음</span></div>';
    var bp = best && best.n ? best.iso.split("-") : null;
    var sum = '<div class="heat-sum">최근 ' + weeks + '주 <b>' + total + '</b>건' + (notesOnly ? ' (노트 기준)' : '') +
      (bp ? ' · 가장 많았던 날 <b>' + (+bp[1]) + '월 ' + (+bp[2]) + '일</b>(' + best.n + '건)' : '') + '</div>';
    return '<div class="heat-wrap">' + dayCol + '<div class="heat">' + grid + '</div></div>' + legend + sum;
  }

  // 이번 주 시간축: 기준일 -2 ~ +7. 각 점 = 기한이 그 날인 할 일 1건 (클릭 = 상세로 이동).
  function weekTimelineHTML() {
    var FROM = -2, TO = 7, cells = [];
    for (var i = FROM; i <= TO; i++) {
      var iso = isoShift(TODAY, i);
      var d = parseD(iso);
      var items = activeTodos.filter(function (t) { return String(t.due || "").split("T")[0] === iso; });
      cells.push({ iso: iso, off: i, wd: d ? d.getDay() : 0, dd: d ? d.getDate() : 0, mm: d ? d.getMonth() + 1 : 0, items: items });
    }
    var withDue = activeTodos.filter(function (t) { return !!t.due; }).length;
    var noDue = activeTodos.length - withDue;
    var inRange = cells.reduce(function (a, c) { return a + c.items.length; }, 0);
    var grid = cells.map(function (c) {
      var cls = "wtl-day" + (c.off === 0 ? " is-today" : c.off < 0 ? " is-past" : ((c.wd === 0 || c.wd === 6) ? " weekend" : ""));
      var pips = c.items.map(function (t) {
        var k = c.off < 0 ? " od" : (t.kind === "issue" ? " iss" : "");
        var tip = t.title + " · " + ddayLabel(t).txt;
        return '<button class="wtl-pip' + k + '" type="button" data-tip="' + esc(tip) + '"' +
          ' data-todo-jump="' + esc(String(todos.indexOf(t))) + '" aria-label="' + esc(tip) + '"></button>';
      }).join("");
      return '<div class="' + cls + '"><span class="wtl-d">' + esc(WD[c.wd]) + '<b>' + c.dd + '</b></span>' +
        '<span class="wtl-pips">' + pips + '</span></div>';
    }).join("");
    var legend = '<div class="wtl-legend">' +
      '<span><i class="k-od"></i>지난 기한</span><span><i class="k-rem"></i>리마인더</span><span><i class="k-iss"></i>이슈</span>' +
      '<span>이 구간 ' + inRange + '건' + (noDue ? ' · 기한 없는 항목 ' + noDue + '건은 할 일 탭 ‘예정’' : '') + '</span></div>';
    return '<div class="wtl"><div class="wtl-grid">' + grid + '</div>' + legend + '</div>';
  }

  // 본문 발췌 (인라인 리딩) — 제목 줄·빈 줄을 걷어내고 앞부분만
  function bodySnippet(path, maxLen) {
    var e = contentByPath[path];
    if (!e) return null;
    if (e.table) {
      var rows = e.table || [];
      return rows.length ? "표 " + rows.length + "행 · " + (rows[0] || []).slice(0, 4).join(" · ") : null;
    }
    if (!e.content) return null;
    var lines = String(e.content).split("\n").filter(function (l) {
      var s2 = l.trim();
      return s2 && s2.charAt(0) !== "#" && !/^[-=]{3,}$/.test(s2);
    });
    var txt = lines.slice(0, 3).join(" ").replace(/[*`>]/g, "").replace(/\s+/g, " ").trim();
    if (!txt) return null;
    var lim = maxLen || 180;
    return txt.length > lim ? txt.slice(0, lim) + "…" : txt;
  }

  // ── 백링크: 이 경로를 참조하는 곳 (역방향 — 파일 탐색기가 구조적으로 못 하는 것) ──
  function backlinksOf(path) {
    if (!path) return [];
    var out = [];
    todos.forEach(function (t, i) {
      if (t.source === path) {
        out.push({ g: "할 일", t: (KIND_LABEL[t.kind] || t.kind) + " · " + t.title, k: "todo", v: String(i) });
      }
    });
    projectList.forEach(function (p) {
      var hit = (p.outputs || []).some(function (o) { return (typeof o === "string" ? o : o.path) === path; });
      if (!hit && projectSlug(path) && projectSlug(path) === matchedSlug(p)) hit = true;
      if (hit) out.push({ g: "프로젝트", t: p.goal, k: "project", v: p.id });
    });
    return out;
  }
  // 이 경로를 참조하는 폴더 이웃 (같은 프로젝트 폴더의 다른 산출물)
  function siblingsOf(path) {
    var sl = projectSlug(path);
    if (!sl) return [];
    return allRecords().filter(function (f) { return f.path !== path && projectSlug(f.path) === sl; }).slice(0, 6);
  }

  // ── 홈 탭 ──────────────────────────────────────────────────
  function renderHome() {
    var identityMissing = !agent.identityLoaded;
    var hour = 11;
    try { hour = +(s.session.lastActiveAt.split("T")[1].slice(0, 2)); } catch (e) {}
    var greet = hour < 12 ? "좋은 아침이에요" : hour < 17 ? "좋은 오후예요" : "좋은 저녁이에요";

    var activeCount = projectList.filter(function (p) { return !p.done; }).length;
    var doneCount = projectList.filter(function (p) { return p.done; }).length;
    var isWarn = !!(proj && proj.health === "주의");
    var pgProg = proj ? (proj.progress != null ? proj.progress : phaseProgress(proj)) : null;

    // 프로젝트 절 — 전부 데이터 파생(상수 사유 금지). healthReason 있으면 사용, 없으면 생략.
    var projClause;
    if (proj) {
      var stage = ((proj.phase ? proj.phase + " 단계" : "") + (pgProg != null ? "(" + pgProg + "%)" : "")).trim();
      var reason = (isWarn && proj.healthReason) ? (proj.healthReason + " 때문에 ") : "";
      projClause = "‘" + proj.goal + "’은 " + (stage ? stage + "로 진행 중이고, " : "진행 중이고, ") +
        (isWarn ? (reason + "한 곳이 주의예요.") : "순항 중이에요.");
    } else {
      projClause = doneCount ? "진행 중인 프로젝트는 없고, 완료한 프로젝트가 " + doneCount + "건 있어요." : "진행 중인 프로젝트는 아직 없어요.";
    }
    var sentence = identityMissing
      ? "먼저 identity/IDENTITY.md 를 채우고 텔레그램으로 말을 걸어보세요. 그러면 오늘 상황이 여기에 자동으로 채워져요."
      : (overdueN > 0
        ? "지난 일 " + overdueN + "건만 먼저 처리하면 오늘은 가벼워요. " + projClause
        : "오늘은 지난 일 없이 깔끔해요. " + projClause);

    var hero = '<div class="hero">' +
      '<p class="hi">' + esc(greet) + (agent.businessName ? ' <span class="biz-in">' + esc(agent.businessName) + '</span> 님' : '') + '</p>' +
      '<p class="hi-sub">' + esc(sentence) + '</p>' +
    '</div>';

    // ── KPI 스트립 4칩 — 라벨 + 값 + (실측 가능하면) 델타 + 추이 시각화 ──
    // 리서치 기준: KPI 카드는 라벨·값·델타·추이 4요소. 단, **한 카드에 시각화는 하나만**(막대·선 중복 금지).
    // 정직: 델타는 실데이터로 계산 가능한 것만 붙인다. 활동은 어제 데이터가 상태 파일에 없어 델타 없음.
    var actN = (today.activities || []).length;
    var recTotal = Object.keys(records.counts || {}).reduce(function (a, k) { return a + (records.counts[k] || 0); }, 0);
    var actSub = "기록 " + (tcounts.notes || 0) + " · 이슈 " + (tcounts.issues || 0) + " · 초안 " + (tcounts.drafts || 0);

    // ① 해야 할 일 — 기한 분포 막대(지남/오늘/D1~2/D3~7/그 외)
    var dueDist = (function () {
      var b = { od: 0, td: 0, d12: 0, d37: 0, far: 0 };
      activeTodos.forEach(function (t) {
        var d = dayDiff(t.due);
        if (d === null) { b.far++; return; }
        if (d < 0) b.od++;
        else if (d === 0) b.td++;
        else if (d <= 2) b.d12++;
        else if (d <= 7) b.d37++;
        else b.far++;
      });
      return [
        { n: b.od, ax: "지남", tip: "기한 지남 " + b.od + "건", warn: true },
        { n: b.td, ax: "오늘", tip: "오늘 마감 " + b.td + "건" },
        { n: b.d12, ax: "1~2", tip: "1~2일 뒤 " + b.d12 + "건" },
        { n: b.d37, ax: "3~7", tip: "3~7일 뒤 " + b.d37 + "건" },
        { n: b.far, ax: "그외", tip: "8일 뒤·기한 없음 " + b.far + "건" }
      ];
    })();

    // ② 오늘 활동 — 시각 분포 막대(3시간 구간). activities[].time 실측.
    var actDist = (function () {

      });

    // ④ 쌓인 기록 — 14일 스파크라인 + 7일 대 7일 실측 델타
    var recSeries = recDayCounts(14, true);

    var kpi3 = proj
      ? '<a class="kpi" href="#project"><span class="kpi-k">프로젝트' + (isWarn ? ' <span class="pin warn"></span>' : '') + '</span>' +

            : '<span class="kpi-v" style="font:var(--g-title-2)">' + esc(proj.phase || '진행 중') + '</span>') +
          // 단계·진행칸은 아래 분절 미터가 말한다 — 서브라벨은 건강 상태만 (중복 표기 제거)
          '<span class="kpi-sub">' + (proj.health ? '<span class="' + (isWarn ? 'wn' : '') + '">' + esc(proj.health) + '</span>' : esc(proj.phase || '진행 중')) +

          '<span class="kpi-viz" data-viz="phase">' + pmeterHTML(proj.phases || [], (proj.phases || []).indexOf(proj.phase), false) + '</span></a>'
      : '<a class="kpi" href="#project"><span class="kpi-k">프로젝트</span>' +
          '<span class="kpi-v">' + activeCount + '<span class="u">건</span></span>' +
          '<span class="kpi-sub">' + (doneCount ? '완료 ' + doneCount + '건' : '진행 중 없음') + '</span></a>';
    var kpis = '<div class="kpis">' +
      '<a class="kpi" href="#todos"><span class="kpi-k">해야 할 일</span>' +
        '<span class="kpi-v">' + activeTodos.length + '<span class="u">건</span></span>' +
        '<span class="kpi-sub">' + (overdueN > 0
          ? '<span class="od"><span class="odd"></span>지난 ' + overdueN + '건</span> · 오늘 ' + todayN + '건'
          : (activeTodos.length ? '오늘 ' + todayN + '건 · 예정 ' + laterN + '건' : '지금 챙길 일 없음')) + '</span>' +
        (activeTodos.length ? mbarsHTML(dueDist, { axis: true, id: "due", label: "기한 분포" }) : '') + '</a>' +

      '<a class="kpi" href="#records"><span class="kpi-k">쌓인 기록</span>' +
        '<span class="kpi-v">' + recTotal + '<span class="u">건</span></span>' +
        '<span class="kpi-sub">' + (recTotal ? '5개 분류' + deltaHTML(recSeries, 7, "최근 7일 대 그 직전 7일") : '아직 기록 없음') + '</span>' +

    '</div>';

    // 오늘 챙길 일 (없으면 긍정 빈 상태)
    var HOME_TODO_CAP = 6; // 홈은 글랜스용 — 초과분은 할 일 탭으로 (스캔성 유지)
    var sorted = activeTodos.slice().sort(function (a, b) { return rank(a) - rank(b); });

    var restN = sorted.length - top.length;
    var todoCard;
    if (top.length) {
      var todoBody = '<ul class="rows">';

      todoBody += '</ul>';
      var todoSummary = '<div class="list-summary">지난 <b>' + overdueN + '</b> · 오늘 <b>' + todayN + '</b> · 예정 <b>' + laterN + '</b>' +
        (restN > 0 ? ' · <a href="#todos">외 ' + restN + '건 →</a>' : '') + '</div>';
      todoCard = '<section class="card" aria-labelledby="home-todo-h">' +
        '<h2 class="card-title" id="home-todo-h">오늘 챙길 일 <span class="count">· ' +
          (restN > 0 ? '상위 ' + top.length + ' / ' + sorted.length + '건' : '전체 ' + sorted.length + '건') + '</span>' +
          '<a class="more" href="#todos">할 일 탭 →</a></h2>' + todoBody + todoSummary + '</section>';
    } else {
      todoCard = '<section class="card" aria-labelledby="home-todo-h">' +
        '<h2 class="card-title" id="home-todo-h">오늘 챙길 일</h2>' +
        '<div class="empty"><span class="em">✅</span>지금 챙길 일이 없어요. 리마인더·이슈가 생기면 여기에 모여요.</div></section>';
    }

    // 진행 프로젝트 미니 (필드 결측 방어)
    var projMini;
    if (proj) {
      var metaChips = '';
      if (proj.health) metaChips += '<span class="chip ' + healthChipCls(proj.health) + '">' + esc(proj.health) + '</span>';
      if (proj.phase) metaChips += '<span class="chip accent">' + esc(proj.phase) + ' 단계</span>';
      var bar = (pgProg != null)
        ? '<div class="progress"><div class="progress-track"><div class="progress-fill" style="width:' + pgProg + '%"></div></div><span class="progress-pct">' + pgProg + '%</span></div>' : '';
      projMini = '<section class="card" aria-labelledby="home-proj-h">' +
        '<h2 class="card-title" id="home-proj-h">진행 프로젝트<a class="more" href="#project">자세히 →</a></h2>' +
        '<p class="mini-goal">' + esc(proj.goal) + '</p>' + (metaChips ? '<div class="mini-meta">' + metaChips + '</div>' : '') + bar + '</section>';
    } else {
      projMini = '<section class="card" aria-labelledby="home-proj-h">' +
        '<h2 class="card-title" id="home-proj-h">진행 프로젝트<a class="more" href="#project">프로젝트 탭 →</a></h2>' +
        '<div class="empty"><span class="em">🚀</span>' + (doneCount ? '진행 중인 프로젝트가 없어요. 완료 ' + doneCount + '건은 프로젝트 탭에 있어요.' : '진행 중인 프로젝트가 없어요. 큰 일을 맡기면 팀이 꾸려져요.') + '</div></section>';
    }

    var acts = (today.activities || []).slice(-3).reverse();
    var actBody;
    if (acts.length) {
      actBody = '<ul class="rows timeline">';
      acts.forEach(function (a) {
        actBody += '<li><span class="t-time">' + esc(a.time) + '</span><span class="t-text">' + esc(a.summary) + '</span><span class="t-tag">' + esc(TYPE_LABEL[a.type] || "") + '</span></li>';
      });
      actBody += '</ul>';
    } else {
      actBody = '<div class="empty"><span class="em">📝</span>아직 오늘 활동이 없어요. 텔레그램으로 메모를 던져보세요.</div>';
    }
    var actMini = '<section class="card" aria-labelledby="home-act-h">' +
      '<h2 class="card-title" id="home-act-h">오늘 활동 <span class="count">· 최근</span><a class="more" href="#records">기록 보기 →</a></h2>' + actBody + '</section>';

    // 지금 결정할 것 — 홈의 단일 강조 1건 + 다음 후보 2건 (지난 일 > 오늘 마감 > 주의 프로젝트).
    // primary 버튼은 화면당 1회 규율 유지 — 후보는 ghost 만 쓴다(GYEOL 4대 불가침).
    var decide = "";
    if (!identityMissing) {
      var dSorted = activeTodos.slice().sort(function (a, b) { return rank(a) - rank(b); });
      var cand = [];
      dSorted.forEach(function (t) {
        var bb = bucket(t);
        if (bb === "past") cand.push({ t: t, kind: "od" });
        else if (bb === "today") cand.push({ t: t, kind: "today" });
      });

      var pick = cand[0] || null;
      var nexts = cand.slice(1, 3);
      function kLabel(k) { return k === "od" ? "지난 일부터" : k === "today" ? "오늘 마감" : "프로젝트 점검"; }
      if (pick) {
        var nextHTML = "";
        if (nexts.length) {

            '<span class="xlink-h" style="width:100%;margin-top:0">그다음 · ' + nexts.length + '건</span>' +
            nexts.map(function (c) {
              if (c.p) return '<a class="xlink" href="#project"><span class="ic" aria-hidden="true">◐</span>' +
                '<span class="tx">' + esc(c.p.goal) + '</span></a>';
              var ddx = ddayLabel(c.t);
              return '<button class="xlink" type="button" data-todo-jump="' + esc(String(todos.indexOf(c.t))) + '">' +
                '<span class="ic" aria-hidden="true">' + (c.kind === "od" ? "◉" : "◯") + '</span>' +
                '<span class="tx">' + esc(c.t.title) + '</span><span class="ic">' + esc(ddx.txt) + '</span></button>';
            }).join("") + '</div>';
        }
        if (pick.p) {
          decide = '<section class="decide warn" aria-labelledby="decide-h">' +
            '<div class="decide-body"><span class="decide-k" id="decide-h">프로젝트 점검</span>' +
            '<p class="decide-t">' + esc(pick.p.goal) + '</p>' +
            (pick.p.healthReason ? '<p class="decide-why">' + esc(pick.p.healthReason) + '</p>' : '') + '</div>' +
            '<div class="decide-acts"><a class="g-btn g-btn--primary" href="#project">자세히 보기</a></div>' + nextHTML + '</section>';
        } else {
          decide = '<section class="decide' + (pick.kind === "od" ? ' od' : '') + '" aria-labelledby="decide-h">' +
            '<div class="decide-body"><span class="decide-k" id="decide-h">' + kLabel(pick.kind) + '</span>' +
            '<p class="decide-t">' + esc(pick.t.title) + '</p>' +
            '<p class="decide-why">' + (pick.kind === "od" ? "기한이 지난 일이 오늘을 무겁게 해요 — 이것부터 정리하면 좋아요." : "오늘 안에 처리하면 좋은 일이에요.") + '</p></div>' +
            '<div class="decide-acts">' +
              (pick.t.source ? '<button class="g-btn g-btn--primary" type="button" data-viewer="' + esc(pick.t.source) + '">지금 보기</button>' : '') +
              '<a class="g-btn g-btn--ghost" href="#todos">할 일 탭 →</a>' +
            '</div>' + nextHTML + '</section>';
        }
      }
    }

    // 이번 주 시간축 — due 가 날짜인데 화면에 시간축이 없던 결함 해소(파일 탐색기에 캘린더는 없다)
    var weekCard = activeTodos.length
      ? '<section class="card" aria-labelledby="home-wk-h">' +
        '<h2 class="card-title" id="home-wk-h">이번 주 기한 <span class="count">· ' + esc(kdateShort(TODAY)) + ' 기준</span>' +
        '<a class="more" href="#todos">할 일 탭 →</a></h2>' + weekTimelineHTML() + '</section>'
      : "";

    // 기록이 쌓인 흐름 — 실제 파일 날짜 분포(추이 감각은 숫자 하나로 안 나온다)
    var heatCard = allRecords().length
      ? '<section class="card" aria-labelledby="home-heat-h">' +
        '<h2 class="card-title" id="home-heat-h">기록이 쌓인 흐름<a class="more" href="#records">기록 탭 →</a></h2>' +
        heatHTML(8, true) + '</section>'
      : "";

    var split = '<div class="split"><div class="stack">' + todoCard + weekCard + '</div>' +
      '<div class="stack">' + projMini + actMini + heatCard + '</div></div>';
    return panelWrap("home", "", hero + decide + kpis + split);
  }
  function kdateShort(iso) { var p = String(iso).split("-"); return p.length === 3 ? (+p[1]) + "/" + (+p[2]) : iso; }

  // ── 할 일 탭 ───────────────────────────────────────────────
  // 필터 상태 — 목록만 부분 교체한다(전체 재렌더 시 검색 입력의 포커스·커서가 날아간다)
  var todoFilter = { kind: "all", due: "all", q: "" };
  function todoMatches(t) {
    if (todoFilter.kind !== "all" && t.kind !== todoFilter.kind) return false;
    if (todoFilter.due !== "all" && bucket(t) !== todoFilter.due) return false;
    var q = todoFilter.q.trim().toLowerCase();
    if (q) {
      var hay = (t.title || "") + " " + (t.source || "") + " " + (bodySnippet(t.source, 400) || "");
      if (hay.toLowerCase().indexOf(q) < 0) return false;
    }
    return true;
  }
  // ── 큐 + 작업대 (W21) ──────────────────────────────────────
  // 수직 나열이 문제가 아니라 **할 일이 끝나지 않는 것**이 문제였다(보기만 되고 행동이 없었다).
  // 그래서 좌=우선순위 큐 / 우=작업대(맥락 전부 + 행동) 2단으로 바꾼다.
  // 기록 탭과 같은 문법이라 학습이 한 번으로 끝난다.
  var todoView = { sel: null };

  // 큐 행 — 보존 계약 훅(.bucket · .todo-row)은 유지하고, 클릭은 '펼침' 이 아니라 '선택' 이다.
  function queueRow(t, gi, terms) {
    var dd = ddayLabel(t);
    var sel = todoView.sel === gi;
    var ov = (t.state !== "done" && bucket(t) === "past") ? '<span class="ov" aria-hidden="true"></span>' : "";
    return '<li class="todo' + (t.state === "done" ? " is-done" : "") + '">' +
      '<button class="todo-row q-row' + (sel ? " sel" : "") + '" type="button" data-todo-sel="' + gi + '"' +
        (sel ? ' aria-current="true"' : '') + '>' +
        '<span class="kind ' + esc(t.kind) + '">' + esc(KIND_LABEL[t.kind] || t.kind) + '</span>' +
        '<span class="todo-title">' + ov + ((terms && terms.length) ? hlm(t.title, terms) : esc(t.title)) + '</span>' +
        '<span class="todo-meta ' + dd.cls + '">' + esc(t.state === "done" ? "완료" : dd.txt) + '</span>' +
      '</button></li>';
  }

  function todoListHTML() {
    var terms = todoFilter.q.trim() ? [todoFilter.q.trim()] : [];
    var filtered = todos.map(function (t, i) { return { t: t, i: i }; }).filter(function (o) { return todoMatches(o.t); });
    var actives = filtered.filter(function (o) { return o.t.state !== "done"; });
    var dones = filtered.filter(function (o) { return o.t.state === "done"; });
    var anyFilter = todoFilter.kind !== "all" || todoFilter.due !== "all" || !!todoFilter.q.trim();

    // 선택이 없거나 걸러져 사라졌으면 큐 맨 위(가장 급한 것)를 고른다 — 열자마자 작업대가 차 있게
    var visible = actives.slice().sort(function (a, b) { return rank(a.t) - rank(b.t); });
    var stillThere = false;
    visible.forEach(function (o) { if (o.i === todoView.sel) stillThere = true; });
    dones.forEach(function (o) { if (o.i === todoView.sel) stillThere = true; });
    if (!stillThere) todoView.sel = visible.length ? visible[0].i : (dones.length ? dones[0].i : null);

    function bucketBlock(key, label, cls, emptyMsg, emptyEm) {
      var items = actives.filter(function (o) { return bucket(o.t) === key; })
        .sort(function (a, b) { return rank(a.t) - rank(b.t); });
      if (!items.length && anyFilter) return "";   // 필터 중엔 빈 버킷이 화면을 먹지 않게 접는다
      var body;
      if (items.length) {
        body = '<ul class="rows">';
        items.forEach(function (o) { body += queueRow(o.t, o.i, terms); });
        body += '</ul>';
      } else {
        body = '<div class="empty"><span class="em">' + emptyEm + '</span>' + esc(emptyMsg) + '</div>';
      }
      return '<div class="bucket ' + cls + '"><div class="bucket-head">' + esc(label) +
        ' <span class="bn">' + items.length + '건</span></div>' + body + '</div>';
    }
    var buckets =
      bucketBlock("past", "지난 (먼저 처리)", "past", "지난 일이 없어요. 깔끔해요.", "✅") +
      bucketBlock("today", "오늘", "today", "오늘 마감할 일이 없어요.", "🧹") +
      bucketBlock("later", "예정 · 열린 이슈", "later", "예정된 일이 없어요.", "📅");
    if (!buckets) {
      buckets = '<div class="empty rec-search-empty"><span class="em">🔍</span>' +
        '조건에 맞는 할 일이 없어요. 필터를 넓혀 보세요.</div>';
    }
    // 완료 — 기본 접힘. 상태 파일에 완료 시각이 없으므로 "오늘 완료" 라고 단정하지 않는다.
    var doneBlock = "";
    if (dones.length) {
      doneBlock = '<div class="fold"><button class="fold-h" type="button" data-fold="todo-done" aria-expanded="' +
        (openSet["fold-todo-done"] ? "true" : "false") + '" aria-controls="fold-todo-done">' +
        '<span class="tw" aria-hidden="true">›</span>완료<span class="n">' + dones.length + '건</span></button>' +
        '<div class="fold-b" id="fold-todo-done"' + (openSet["fold-todo-done"] ? "" : " hidden") + '><ul class="rows">' +
        dones.map(function (o) { return queueRow(o.t, o.i, terms); }).join("") + '</ul></div></div>';
    }
    return '<aside class="card todo-queue" aria-label="할 일 큐">' + buckets + doneBlock + '</aside>' +
      todoBenchHTML(terms);
  }

  // 비슷한 지난 기록 — 제목의 낱말이 본문에 나오는 기록. **낱말 일치**임을 화면에 밝힌다(추론 아님).
  //
  // 그냥 낱말 수만 세면 '정리·결과·확인' 같은 흔한 말로 무관한 문서가 잔뜩 걸린다(실측: 무관한
  // 프로젝트 계획서 4건). 그래서 **흔한 낱말은 값을 낮춘다** — 전체 기록의 40% 이상에 나오는
  // 낱말은 버리고, 드물수록 점수를 높게 준다(문서빈도 역가중). 한국어 명사는 2음절이 많아
  // 길이로는 못 거른다.
  var _dfCache = null;
  function docFreq() {
    if (_dfCache) return _dfCache;
    var df = {}, recs = allRecords(), n = 0;
    recs.forEach(function (f) {
      var e = contentByPath[f.path];
      if (!e || !e.content) return;
      n++;
      var seen = {};
      String((f.title || "") + " " + e.content).replace(/[^가-힣a-zA-Z0-9]+/g, " ").split(" ")
        .forEach(function (w) { if (w.length >= 2 && !seen[w]) { seen[w] = 1; df[w] = (df[w] || 0) + 1; } });
    });
    _dfCache = { df: df, n: n || 1 };
    return _dfCache;
  }
  function similarRecords(t, limit) {
    var words = String(t.title || "").replace(/[^가-힣a-zA-Z0-9]+/g, " ").split(" ")
      .filter(function (w) { return w.length >= 2; });
    if (!words.length) return [];
    var D = docFreq();
    // 흔한 낱말 제거 + 드문 낱말 가중
    var scored = [];
    words.forEach(function (w) {
      var f = (D.df[w] || 0) / D.n;
      if (f > 0.4) return;                       // 열 문서 중 넷 이상에 나오면 변별력이 없다
      scored.push({ w: w, weight: 1 / (1 + (D.df[w] || 0)) });
    });
    if (!scored.length) return [];
    var out = [];
    allRecords().forEach(function (f) {
      if (!f.path || f.path === t.source) return;
      var e = contentByPath[f.path];
      var body = (e && e.content) ? String(e.content) : "";
      var hay = (f.title || "") + " " + body;
      var score = 0, hitWords = [];
      scored.forEach(function (s) { if (hay.indexOf(s.w) >= 0) { score += s.weight; hitWords.push(s.w); } });
      if (hitWords.length) out.push({ f: f, score: score, words: hitWords });
    });
    // 낱말 하나만 걸린 건 우연일 확률이 높다 — 둘 이상 걸린 게 있으면 그것만 보여준다
    var multi = out.filter(function (o) { return o.words.length >= 2; });
    if (multi.length) out = multi;
    out.sort(function (a, b) { return b.score - a.score || String(b.f.date || "").localeCompare(String(a.f.date || "")); });
    return out.slice(0, limit || 4);
  }

  // 왜 지금 이 항목인지 — 전부 데이터 파생(상수로 지어낸 긴급함 금지)
  function whyNow(t) {

    if (b === "today") return "오늘이 기한이에요.";
    if (t.kind === "issue" && !t.due) return "기한 없이 열려 있는 이슈예요 — 닫으려면 방침이 필요해요.";
    if (d != null) return d + "일 뒤가 기한이에요.";
    return "기한이 없는 항목이에요.";

  function healthChipCls(h) { return h === "주의" ? "warn" : (h === "완료" || h === "순항") ? "success" : "accent"; }

  function projectListHTML() {

    var doneP = projectList.filter(function (p) { return p.done; });
    // 카드가 216자짜리 빈 화면이던 결함 해소 — 카드 안에서 판단이 끝나게 실데이터를 얹는다.
    // (단계 위치 · 팀 · 산출물 수 · 최근 로그/요약 · 주의 사유). 없는 값은 그냥 생략한다.

        var sm = String(p.summary), dot = sm.indexOf(". ");

  // notes/projects/<슬러그>/... 에서 슬러그 추출
  function projectSlug(path) { var m = String(path || "").split("notes/projects/")[1]; return m ? m.split("/")[0] : null; }
  // 완료 프로젝트 goal ↔ records.projects 슬러그 매칭 → {slug, items, hits, why}
  // 추정 매칭이므로 **근거를 화면에 밝힌다**(어느 폴더를 무슨 낱말로 골랐는지). 오매칭을 사용자가 알아챌 수 있게.
  function matchProject(p) {
    var none = { slug: null, items: [], hits: [], why: "" };
    var projs = (records.projects || []); if (!projs.length) return none;
    var bySlug = {};
    projs.forEach(function (o) { var sl = projectSlug(o.path); if (sl) (bySlug[sl] = bySlug[sl] || []).push(o); });
    var slugs = Object.keys(bySlug); if (!slugs.length) return none;
    var tokens = String(p.goal || "").replace(/[^가-힣a-zA-Z0-9]+/g, " ").split(" ").filter(function (t) { return t.length >= 2; });
    // 첫 일치 반환은 "런칭" 같은 공통 토큰이 다른 프로젝트 폴더에 먼저 걸린다(교차 오매칭) —
    // 가장 많은 토큰이 일치하는 슬러그를 고른다.
    var best = null, bestScore = 0, bestHits = [];
    for (var i = 0; i < slugs.length; i++) {
      var hits = [];
      for (var j = 0; j < tokens.length; j++) { if (slugs[i].indexOf(tokens[j]) !== -1) hits.push(tokens[j]); }
      if (hits.length > bestScore) { bestScore = hits.length; best = slugs[i]; bestHits = hits; }
    }
    if (best) return { slug: best, items: bySlug[best], hits: bestHits, why: "낱말 일치" };
    var doneN = projectList.filter(function (x) { return x.done; }).length; // 완료 1개 & 폴더 1개면 그것
    if (doneN === 1 && slugs.length === 1) return { slug: slugs[0], items: bySlug[slugs[0]], hits: [], why: "폴더가 하나뿐" };
    return none;
  }
  function matchedOutputs(p) { return matchProject(p).items; }

  function outListHTML(items) {

  // 멤버 → 스태프 매칭: name 정확 일치 → role 정확 일치 → "팀장(PM)" 처럼 접두 일치
  function staffForMember(m) {
    if (!m) return null;
    if (m.name && staffByName[m.name]) return staffByName[m.name];

  // 로그를 단계에 붙인다 — **단계 이름이 문장에 등장한 항목만**. 나머지는 버리지 않고 전체 로그에 남는다.
  function phaseLogs(p) {
    var phases = p.phases || [], logs = p.log || [];
    var byPhase = {}, used = {};
    logs.forEach(function (l, li) {
      var msg = String(l.message || ""), hitIdx = -1;
      phases.forEach(function (ph, i) { if (ph && msg.indexOf(ph) >= 0) hitIdx = i; }); // 마지막 언급 단계에 붙인다
      if (hitIdx >= 0) { (byPhase[hitIdx] = byPhase[hitIdx] || []).push(l); used[li] = 1; }

  function projectDetailHTML(p) {

      var pl = phaseLogs(p);
      steps = '<ul class="ptl" aria-label="진행 단계 타임라인">';
      phases.forEach(function (ph, i) {
        var cls = p.done ? "past" : ((i === curIdx) ? "active" : (curIdx > -1 && i < curIdx ? "past" : "future"));
        var mine = pl.byPhase[i] || [];
        var logHTML = mine.length
