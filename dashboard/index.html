        steps += '<li class="' + cls + '"><span class="nd" aria-hidden="true"></span>' +
          '<span class="ph">' + esc(ph) + '</span>' +
          '<span class="phm">' + (cls === "active" ? "진행 중" : cls === "past" ? "지남" : "예정") +
            (mine.length ? " · 로그 " + mine.length : "") + '</span>' + logHTML + '</li>';
      });
      steps += '</ul>';
    }

    var hasMembers = (p.members || []).length > 0;
    var hasLog = (p.log || []).length > 0;

    // 산출물: 직접 outputs → 없으면 완료 프로젝트는 records.projects 슬러그 매칭
    var outItems = (p.outputs || []), outSource = "direct", matchInfo = null;
    if (!outItems.length && p.done) {
      matchInfo = matchProject(p);
      outItems = matchInfo.items;
      outSource = outItems.length ? "matched" : "none";
    }
    // outputs 가 문자열 배열일 수 있다(계약 허용) — outListHTML 은 {path} 를 기대한다
    outItems = outItems.map(function (o) { return (typeof o === "string") ? { path: o } : o; });
    var outsBlock;
    if (outItems.length) {
      outsBlock = '<div class="sub-h">산출물 · ' + outItems.length + '건' +
        (outSource === "matched" ? ' <span style="font-weight:400;color:var(--g-fg-subtle)">· 기록에서 연결(추정)</span>' : '') + '</div>' +
        outListHTML(outItems) +
        // 추정 매칭이면 근거를 밝힌다 — 오매칭을 사용자가 알아챌 수 있어야 한다
        (outSource === "matched" && matchInfo
          ? '<div class="match-why">이 목록은 상태 파일에 산출물 경로가 없어 <code>' + esc(matchInfo.slug || "") +
            '</code> 폴더를 ' + (matchInfo.hits.length
              ? '제목 낱말 ‘' + esc(matchInfo.hits.join("’ · ‘")) + '’ 일치로'
              : esc(matchInfo.why) + ' 로') +
            ' 연결한 <b>추정</b>이에요. 다르면 기록 탭에서 직접 확인하세요.</div>'
          : "");
    } else if (p.done) {
      outsBlock = '<div class="sub-h">산출물</div>' +
        '<div class="empty" style="padding:var(--g-space-5)"><span class="em">🗂️</span>이 프로젝트의 산출물은 <a class="more" href="#records" style="color:var(--g-brand-fg)">기록 탭</a>에서 볼 수 있어요.</div>';
    } else {
      outsBlock = '<div class="sub-h">산출물 · 0건</div><div class="empty" style="padding:var(--g-space-5)"><span class="em">📄</span>아직 산출물이 없어요.</div>';
    }

    // 멤버·로그: 완료+둘 다 없음 → 정직한 한 줄. 그 외엔 섹션 표시.
    var teamLogBlock;
    if (p.done && !hasMembers && !hasLog) {
      teamLogBlock = '<div style="font:var(--g-caption);color:var(--g-fg-subtle);padding:var(--g-space-5) var(--g-space-1) var(--g-space-1)">완료 요약만 보존돼요 — 당시 멤버·진행 로그는 따로 남지 않았어요.</div>';
    } else {
      var mem = "";
      (p.members || []).forEach(function (m) {
        var ms = MSTAT_LABEL[m.status] ? m.status : "waiting";
        var st = staffForMember(m);   // 실제 직원과 연결 — 역할만 나열되던 줄에 사람이 보이게
        mem += '<div class="member">' +
          '<span class="m-who">' + (st ? avatarHTML(st, st.name, "") : "") + '</span>' +
          '<span class="m-role">' + esc(st ? st.name : m.role) + '</span>' +
          '<span class="m-task">' + esc(m.task) + (st ? ' <span style="color:var(--g-fg-subtle)">· ' + esc(m.role) + '</span>' : '') + '</span>' +
          '<span class="mstat ' + ms + '">' + esc(MSTAT_LABEL[ms]) + '</span></div>';
      });
      if (!mem) mem = '<div class="empty" style="padding:var(--g-space-5)"><span class="em">🧑‍🤝‍🧑</span>등록된 멤버가 없어요.</div>';
      // 전체 로그 — 6건 중 3건만 보이고 나머지를 볼 길이 없던 결함 해소(접힘으로 전량 열람)
      var log;
      if (hasLog) {
        var lg = p.log.slice().reverse();
        var head = lg.slice(0, 3), rest = lg.slice(3);
        log = '<ul class="rows timeline">' + head.map(function (l) {
          return '<li><span class="t-time">' + esc(l.time) + '</span><span class="t-text">' + esc(l.message) + '</span></li>';
        }).join("") + '</ul>';
        if (rest.length) {
          log += '<div class="fold" style="margin-top:var(--g-space-2)">' +
            '<button class="fold-h" type="button" data-fold="proj-log" aria-expanded="' + (openSet["fold-proj-log"] ? "true" : "false") + '" aria-controls="fold-proj-log">' +
            '<span class="tw" aria-hidden="true">›</span>이전 로그<span class="n">' + rest.length + '건</span></button>' +
            '<div class="fold-b" id="fold-proj-log"' + (openSet["fold-proj-log"] ? "" : " hidden") + '>' +
            '<ul class="rows timeline">' + rest.map(function (l) {
              return '<li><span class="t-time">' + esc(l.time) + '</span><span class="t-text">' + esc(l.message) + '</span></li>';
            }).join("") + '</ul></div></div>';
        }
      } else {
        log = '<div class="empty" style="padding:var(--g-space-5)"><span class="em">🗒️</span>기록된 로그가 없어요.</div>';
      }
      teamLogBlock = '<div class="sub-h">팀 멤버 · ' + (p.members || []).length + '명</div>' + mem +
        '<div class="sub-h">진행 로그 · ' + (p.log || []).length + '건</div>' + log;
    }

    var summaryBlock = p.summary ? '<p class="hi-sub" style="margin-top:0;margin-bottom:var(--g-space-5)">' + esc(p.summary) + '</p>' : '';
    var healthChip = p.health ? '<span class="chip ' + healthChipCls(p.health) + '" title="건강 상태">' + esc(p.health) + '</span>' : '';
    var period = p.done ? (p.completedAt ? '<span class="pc-period" style="margin-left:auto">' + esc(ymd(p.completedAt)) + ' 완료</span>' : '') : '';
    var bar = (p.progress != null)
      ? '<div class="progress" style="margin-bottom:var(--g-space-5)"><div class="progress-track"><div class="progress-fill" style="width:' + p.progress + '%"></div></div><span class="progress-pct">' + p.progress + '%</span></div>' : '';
    var detail = '<section class="card" aria-labelledby="pj-h">' +
      '<button class="back-btn" type="button" data-project-back>‹ 프로젝트 목록</button>' +
      '<div class="proj-top"><h2 class="goal" id="pj-h">' + esc(p.goal) + '</h2>' + healthChip + period + '</div>' +
      summaryBlock + steps + bar +
      outsBlock + teamLogBlock +
    '</section>';
    return '<div class="stack">' + detail + '</div>';
  }

  // 역할명 → 참여 프로젝트 goal (활성 members + history members 매칭). 매칭 안 되면 null.
  function roleRecentGoal(name) {
    if (proj) { var mm = (proj.members || []); for (var i = 0; i < mm.length; i++) if (mm[i].role === name) return proj.goal; }
    var hist = team.history || [];
    for (var h = 0; h < hist.length; h++) { var hm = hist[h].members || []; for (var j = 0; j < hm.length; j++) if (hm[j].role === name) return hist[h].goal; }
    return null;
  }
  // 역할 md 에서 "산출물" 절의 항목을 뽑는다 — 채용 전 '?' 벽 대신 이 직무가 무엇을 만드는지 보여준다.
  // 만들어내지 않는다: 역할 파일에 그 절이 없으면 빈 값을 반환하고 화면은 focus 만 쓴다.
  function roleOutputsPreview(r) {
    var src = r && r.content;
    if (!src) return [];
    var lines = String(src).split("\n");
    var out = [], inSec = false;
    for (var i = 0; i < lines.length; i++) {
      var L = lines[i].trim();
      if (/^#{1,4}\s/.test(L)) { inSec = /산출물|만드는|deliver/i.test(L); continue; }
      if (!inSec) continue;
      // 역할 파일 규약: `- **산출물명**: 설명`. 굵은 라벨만 뽑는다.
      // "이 산출물은 …의 입력이다" 같은 하류 안내 항목은 산출물명이 아니므로 제외한다.
      var m = L.match(/^[-*]\s+\*\*(.+?)\*\*\s*[:：]?/);
      if (!m) continue;
      var txt = m[1].replace(/[`*]/g, "").trim();
      if (!txt || txt.length > 24) continue;
      if (/^이 산출물|입력이다|입력이/.test(txt)) continue;
      out.push(txt);
      if (out.length >= 3) break;
    }
    return out;
  }

  // 관계 지도 — staff[].relationships 를 원형 배치 그래프로. 이름은 직접 라벨(색만으로 식별하지 않는다).
  function relmapHTML() {
    var nodes = staffList.filter(function (st) { return st && st.name; });
    if (nodes.length < 3) return "";
    var edges = [];
    var seen = {};
    nodes.forEach(function (st, i) {
      (st.relationships || []).forEach(function (rl) {
        var other = staffById[rl.with] || staffByName[rl.with];
        if (!other || !other.name) return;
        var j = -1;
        nodes.forEach(function (n, k) { if (n.name === other.name) j = k; });
        if (j < 0 || j === i) return;
        var key = [Math.min(i, j), Math.max(i, j), rl.type].join("-");
        if (seen[key]) return;
        seen[key] = 1;
        edges.push({ a: i, b: j, type: rl.type === "tension" ? "tension" : "fit", note: rl.note || "" });
      });
    });
    if (!edges.length) return "";
    var projLive = (proj && proj.status !== "done") ? proj : null;
    var dutyNames = {};
    if (projLive) (projLive.members || []).forEach(function (m) { if (m.name) dutyNames[m.name] = 1; });

    var W = 320, H = 250, cx = W / 2, cy = H / 2 - 4, R = 92;
    var pos = nodes.map(function (st, i) {
      var ang = (-Math.PI / 2) + (i / nodes.length) * Math.PI * 2;
      return { x: cx + Math.cos(ang) * R, y: cy + Math.sin(ang) * R, ang: ang, st: st };
    });
    var edgeSVG = edges.map(function (e) {
      var A = pos[e.a], B = pos[e.b];
      var tip = A.st.name + " ↔ " + B.st.name + " · " + (e.type === "tension" ? "긴장" : "합") + (e.note ? " — " + e.note : "");
      // 중심을 향해 살짝 휘게 — 직선이 겹쳐 읽히지 않는 문제 회피
      var mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
      var qx = mx + (cx - mx) * 0.35, qy = my + (cy - my) * 0.35;
      return '<path class="edge ' + e.type + '" d="M' + A.x.toFixed(1) + ' ' + A.y.toFixed(1) +
        ' Q' + qx.toFixed(1) + ' ' + qy.toFixed(1) + ' ' + B.x.toFixed(1) + ' ' + B.y.toFixed(1) + '"' +
        ' data-tip="' + esc(tip) + '"><title>' + esc(tip) + '</title></path>';
    }).join("");
    var nodeSVG = pos.map(function (p) {
      var duty = dutyNames[p.st.name] ? " duty" : "";
      var lx = cx + Math.cos(p.ang) * (R + 24), ly = cy + Math.sin(p.ang) * (R + 24);
      var anchor = Math.abs(lx - cx) < 12 ? "middle" : (lx > cx ? "start" : "end");
      var tip = p.st.name + (p.st.role ? " · " + p.st.role : "") + (dutyNames[p.st.name] ? " · 소집 중" : "");
      return '<circle class="node' + duty + '" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="9"' +
          ' data-tip="' + esc(tip) + '"><title>' + esc(tip) + '</title></circle>' +
        '<text class="nm" x="' + lx.toFixed(1) + '" y="' + (ly + 3).toFixed(1) + '" text-anchor="' + anchor + '">' + esc(p.st.name) + '</text>';
    }).join("");
    return '<section class="card" aria-labelledby="relmap-h">' +
      '<h2 class="card-title" id="relmap-h">팀 관계 지도 <span class="count">· 합·긴장 ' + edges.length + '쌍</span></h2>' +
      '<svg class="relmap" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="팀원 사이의 합·긴장 관계 ' + edges.length + '쌍">' +
      edgeSVG + nodeSVG + '</svg>' +
      '<div class="rel-legend"><span><i class="fit"></i>합이 잘 맞음</span><span><i class="tension"></i>긴장(관점 충돌)</span></div>' +
      '<div class="heat-sum">긴장은 나쁜 게 아니라 서로 다른 관점이 부딪히는 지점이에요 — 그 지점에서 검증이 일어나요.</div>' +
      '</section>';
  }

  // 편성 이력 — 진행 중 + 완료 프로젝트별 참여. members 가 없는 이력은 요약만 정직하게 보여준다.
  function rosterHistoryHTML() {
    var rows = [];
    if (proj) {
      rows.push({
        goal: proj.goal, date: ymd(proj.startedAt), live: proj.status !== "done",
        who: (proj.members || []).map(function (m) { var st = staffForMember(m); return st ? st.name : m.role; })
      });
    }
    (team.history || []).forEach(function (h) {
      rows.push({
        goal: h.goal, date: ymd(h.completedAt || h.startedAt), live: false,
        who: (h.members || []).map(function (m) { var st = staffForMember(m); return st ? st.name : m.role; })
      });
    });
    if (!rows.length) return "";
    return '<section class="card" aria-labelledby="rh-h">' +
      '<h2 class="card-title" id="rh-h">편성 이력 <span class="count">· ' + rows.length + '건</span>' +
      '<a class="more" href="#project">프로젝트 탭 →</a></h2>' +
      '<ul class="hist-list">' + rows.map(function (r) {
        return '<li><span class="hd">' + esc(r.date || "") + '</span>' +
          '<span class="hg">' + esc(r.goal) + (r.live ? ' <span class="chip accent">진행 중</span>' : '') + '</span>' +
          '<span class="hm">' + (r.who.length ? esc(r.who.join(" · ")) : '<span style="color:var(--g-fg-subtle)">당시 편성은 따로 남지 않았어요</span>') + '</span></li>';
      }).join("") + '</ul></section>';
  }

  // ── 우리 팀 (roster 역할 카드) — 프로젝트 목록 하단에 렌더 ───
  function renderTeam() {
    var roles = rosterRoles;
    roleMap = {};
    if (!roles.length) {
      return panelWrap("team", "", '<section class="card" aria-labelledby="team-h"><h2 class="card-title" id="team-h">우리 팀</h2>' +
        '<div class="empty"><span class="em">🧑‍🤝‍🧑</span>역할군 정보가 아직 없어요. 프로젝트를 시작하면 필요한 역할이 편성돼요.</div></section>');
    }
    // 소집 매칭: 진행 중 프로젝트의 members[].name ↔ staff[].name (설계된 연결키)
    var projLive = (proj && proj.status !== "done") ? proj : null;
    var dutyByName = {};
    if (projLive) (projLive.members || []).forEach(function (m) { if (m.name) dutyByName[m.name] = m; });
    var hired = staffList.length > 0;
    var onDuty = hired ? staffList.filter(function (st) { return dutyByName[st.name]; }).length : 0;

    var head = "";
    if (!hired) {
      head = '<div class="hire-note"><span aria-hidden="true">👋</span><span>아직 팀원을 채용하기 전이에요. ' +
        '파트너에게 <b>"우리 팀 꾸려줘"</b>라고 말하면 내 사업에 맞는 이름·성향·케미를 가진 8명이 채용됩니다. ' +
        '첫 프로젝트를 맡겨도("○○ 기획 진행해줘") 채용부터 자동으로 진행돼요. 이름·성향은 언제든 바꿀 수 있어요.</span></div>';
    } else {
      head = '<div class="team-summary">' + staffList.length + '명 재직 중 · ' +
        ((onDuty && projLive) ? '<b>' + onDuty + '명 소집 중</b> — ' + esc(projLive.goal) : '지금은 전원 대기') + '</div>';
      var allInitial = staffList.every(function (st) { return !(st.avatar && st.avatar.image); });
      if (allInitial) head += '<div class="hint-line">아바타는 기본 이니셜 배지예요 — 파트너에게 "팀원 아바타 만들어줘"라고 하면 캐릭터 이미지로 업그레이드할 수 있어요.</div>';
    }

    var cards = roles.map(function (r, i) {
      var key = "ri-" + i;
      roleMap[key] = r;
      var st = staffForRole(r);
      var duty = (st && dutyByName[st.name]) || null;
      var stateLine;
      if (duty && projLive) {
        var ms = MSTAT_LABEL[duty.status] ? duty.status : "waiting";
        stateLine = '<div class="role-recent">지금 <span class="pj">' + esc(projLive.goal) + '</span> <span class="mstat ' + ms + '">' + esc(MSTAT_LABEL[ms]) + '</span></div>';
      } else {
        var recentGoal = roleRecentGoal(r.name);
        stateLine = recentGoal
          ? '<div class="role-recent">최근 <span class="pj">' + esc(recentGoal) + '</span></div>'
          : '<div class="role-recent none">필요할 때 소집돼요</div>';
      }
      var outBadge = (r.outputsTotal != null) ? '<span class="role-out">산출 <b>' + r.outputsTotal + '</b></span>' : '';
      var who = st
        ? '<div class="staff-top">' + avatarHTML(st, st.name, "lg") +
          '<div class="staff-id"><span class="staff-name">' + esc(st.name) +
          (st.mbti ? ' <span class="mbti">' + esc(st.mbti) + '</span>' : '') + '</span>' +
          '<span class="staff-role">' + esc(r.name) + '</span></div></div>'
        : '<div class="staff-top"><span class="avatar lg vacant" aria-hidden="true">?</span>' +
          '<div class="staff-id"><span class="staff-name muted">채용 대기</span>' +
          '<span class="staff-role">' + esc(r.name) + '</span></div></div>';
      var hint = '<span class="role-more" aria-hidden="true">' + (st ? '직원 카드 ›' : '역할 카드 ›') + '</span>';
      // 채용 전: '?' 만 8장 늘어서던 정보량 0 상태 → 이 직무가 실제로 만드는 산출물을 미리 보여준다
      var pre = "";
      if (!st) {
        var outs = roleOutputsPreview(r);
        if (outs.length) pre = '<div class="role-pre"><b>만드는 것</b> · ' + esc(outs.join(" · ")) + '</div>';
        else if (r.outputsTotal != null) pre = '<div class="role-pre"><b>표준 산출물</b> · ' + r.outputsTotal + '종</div>';
      }
      return '<button class="role-card' + ((st || duty) ? '' : ' idle') + '" type="button" data-role="' + key + '"' +
        ' aria-label="' + esc(st ? st.name + ' 직원 상세 보기' : r.name + ' 역할 상세 보기') + '">' +
        who +
        '<div class="role-focus">' + esc(r.focus || "") + (outBadge ? ' ' + outBadge : '') + '</div>' +
        pre + stateLine + hint + '</button>';
    }).join("");

    var grid = '<section class="card" aria-labelledby="team-h"><h2 class="card-title" id="team-h">우리 팀 <span class="count">· ' +
      (hired ? '재직 ' + staffList.length + '명' : '상비 역할 ' + roles.length) + '</span></h2>' +
      '<div class="roster">' + cards + '</div></section>';
    return panelWrap("team",
      hired ? "우리 회사에 재직 중인 팀원들이에요. 카드를 누르면 성향·관계·직무 기준을 볼 수 있어요."
            : "프로젝트를 맡기면 필요한 팀원이 소집돼요. 카드에 각 직무가 만드는 산출물이 미리 보여요.",
      // 관계 지도는 정사각에 가까워 풀폭 카드에서 죽은 폭이 크다 — 편성 이력과 2단으로 폭을 회수한다
      head + grid + (hired ? '<div class="split">' + relmapHTML() + rosterHistoryHTML() + '</div>' : ""));
  }
  // 역할 카드 클릭 → 모달: 스태프가 있으면 "{이름} — {역할}" 직원 모달, 없으면 역할 md 모달
  function openRole(key) {
    var r = roleMap[key];
    if (!r) return;
    var st = staffForRole(r);
    var header = "";
    if (st) {
      var rel = (st.relationships || []).map(function (rl) {
        var other = staffById[rl.with];
        var nm = other ? other.name : rl.with;
        return '<div class="rel-line"><span class="chip ' + (rl.type === "tension" ? "warn" : "accent") + '">' +
          (rl.type === "tension" ? "긴장" : "합") + '</span> <b>' + esc(nm) + '</b>' +
          (rl.note ? ' — ' + esc(rl.note) : '') + '</div>';
      }).join("");
      header = '<div class="staff-head">' + avatarHTML(st, st.name, "lg") +
        '<div><div class="staff-name">' + esc(st.name) +
        (st.mbti ? ' <span class="mbti">' + esc(st.mbti) + '</span>' : '') + '</div>' +
        '<div class="staff-role">' + esc(r.name) + '</div></div></div>' +
        (st.style ? '<p class="staff-style">' + esc(st.style) + '</p>' : '') +
        (st.appearance ? '<p class="staff-app">' + esc(st.appearance) + '</p>' : '') +
        (rel ? '<div class="rel-block">' + rel + '</div>' : '');
    } else if (r.focus) {
      header = '<p class="hi-sub" style="margin-top:0;margin-bottom:var(--g-space-5)">' + esc(r.focus) + '</p>';
    }
    var body = r.content
      ? '<div class="md-body">' + renderMarkdown(r.content) + '</div>'
      : '<div class="empty" style="padding:var(--g-space-5)"><span class="em">🧑‍🤝‍🧑</span>이 역할의 상세 설명은 아직 준비되지 않았어요.<br>프로젝트에 편성되면 관점·판단기준이 채워집니다.</div>';
    openModal(st ? st.name + ' — ' + r.name : r.name, header + body);
  }

  // ── 칸반보드 탭 (읽기 전용 3열 · 티켓 클릭 = 모달 상세) ────
  function renderKanban() {
    var m = kanbanModel();
    ticketMap = {};
    var o0 = proj && proj.outputs && proj.outputs[0];
    var projOut = o0 ? (typeof o0 === "string" ? o0 : o0.path) : null;
    function card(c, colKey) {
      var id = "tk-" + colKey + "-" + c.idx;
      if (c.type === "todo") {
        var t = c.t;
        var dd = t.state === "done" ? { cls: "done", txt: "완료" } : ddayLabel(t);
        var ov = (t.state !== "done" && bucket(t) === "past") ? '<span class="ov" aria-hidden="true"></span>' : "";
        var stLabel = t.state === "done" ? "완료" : (bucket(t) === "past" ? "지남" : bucket(t) === "today" ? "오늘" : "예정");
        var stCls = t.state === "done" ? "success" : (bucket(t) === "past" ? "danger" : bucket(t) === "today" ? "accent" : "");
        ticketMap[id] = { title: t.title, type: (KIND_LABEL[t.kind] || t.kind), assignee: "파트너",
          statusChip: '<span class="chip ' + stCls + '">' + esc(stLabel) + '</span>', due: dd.txt, source: t.source || null, related: null };
        return '<button class="kcard clickable" type="button" data-ticket="' + id + '">' +
          '<span class="kcard-head" style="pointer-events:none">' +
            '<span class="kcard-main"><span class="kcard-title">' + ov + esc(t.title) + '</span>' +
              '<span class="kcard-tags"><span class="kind ' + esc(t.kind) + '">' + esc(KIND_LABEL[t.kind]) + '</span>' +
              '<span class="ktag tnum ' + dd.cls + '">' + esc(dd.txt) + '</span></span></span>' +
            '<span class="chev" aria-hidden="true">›</span>' +
          '</span></button>';
      } else {
        var mm = c.m, ms = MSTAT_LABEL[mm.status] ? mm.status : "waiting";
        ticketMap[id] = { title: mm.role + " · " + mm.task, type: "멤버 작업", assignee: mm.role,
          statusChip: '<span class="mstat ' + ms + '">' + esc(MSTAT_LABEL[ms]) + '</span>', due: "-", source: null, related: projOut };
        return '<button class="kcard clickable" type="button" data-ticket="' + id + '">' +
          '<span class="kcard-head" style="pointer-events:none">' +
            '<span class="kcard-main"><span class="kcard-title">' + esc(mm.role) + ' · ' + esc(mm.task) + '</span>' +
              '<span class="kcard-tags"><span class="ktag">멤버 작업</span>' +
              '<span class="mstat ' + ms + '">' + esc(MSTAT_LABEL[ms]) + '</span></span></span>' +
            '<span class="chev" aria-hidden="true">›</span>' +
          '</span></button>';
      }
    }
    // 필터: 카드 종류별. 열 구조(대기·진행·완료)는 유지하고 내용만 걸러 흐름 판독을 지킨다.
    function keep(c) {
      if (kanFilter === "all") return true;
      if (kanFilter === "member") return c.type === "member";
      return c.type === "todo" && c.t.kind === kanFilter;
    }
    function col(label, dotCls, list, key, empty, opt) {
      opt = opt || {};
      var shown = list.filter(keep);
      var body = shown.length ? shown.map(function (c) { return card(c, key); }).join("")
        : '<div class="kempty"><span class="em">🌱</span>' + esc(shown.length === list.length ? empty : "이 필터에 해당하는 카드가 없어요.") + '</div>';
      // 부하 표시: WIP 상한은 상태 파일에 없으므로 **지어내지 않는다**. 대신 실측 가능한 '지난 기한 N건' 을 경고로 쓴다.
      var od = shown.filter(function (c) { return c.type === "todo" && c.t.state !== "done" && bucket(c.t) === "past"; }).length;
      var loadHTML = od ? '<span class="kload" title="기한이 지난 카드">지남 ' + od + '</span>' : "";
      var foldable = opt.foldable && shown.length > 0;
      var inner = foldable
        ? '<button class="fold-h" type="button" data-fold="kan-' + key + '" style="border-top:0;padding-top:0" aria-expanded="' +
            (openSet["fold-kan-" + key] ? "true" : "false") + '" aria-controls="fold-kan-' + key + '">' +
            '<span class="tw" aria-hidden="true">›</span>' + esc(opt.foldLabel || "펼치기") + '<span class="n">' + shown.length + '건</span></button>' +
          '<div class="fold-b" id="fold-kan-' + key + '"' + (openSet["fold-kan-" + key] ? "" : " hidden") + '>' + body + '</div>'
        : body;
      return '<section class="kcol' + (od ? " hot" : "") + '" aria-label="' + esc(label) + '">' +
        '<div class="kcol-head"><span class="dotc ' + dotCls + '"></span>' + esc(label) +
          '<span class="kn">' + shown.length + (shown.length !== list.length ? " / " + list.length : "") + '</span>' + loadHTML + '</div>' +
        '<div class="kcards">' + inner + '</div></section>';
    }
    function kchip(v, label, n) {
      return '<button class="fchip" type="button" data-kf="' + v + '" aria-pressed="' + (kanFilter === v ? "true" : "false") + '">' +
        esc(label) + (n != null ? '<span class="n">' + n + '</span>' : '') + '</button>';
    }
    var memberN = ((proj && proj.members) || []).length;
    var fbar = '<div class="fbar"><span class="fgroup" role="group" aria-label="카드 종류 필터">' +
      kchip("all", "전체", m.waiting.length + m.doing.length + m.done.length) +
      kchip("reminder", "리마인더", todos.filter(function (t) { return t.kind === "reminder"; }).length) +
      kchip("issue", "이슈", todos.filter(function (t) { return t.kind === "issue"; }).length) +
      (memberN ? kchip("member", "멤버 작업", memberN) : "") +
      '</span><span class="fresult">열마다 따로 스크롤돼요</span></div>';
    // "완료 · 오늘" → "완료". 상태 파일에 완료 시각이 없으므로 '오늘' 이라고 단정할 수 없다(정직).
    var board = '<div class="kanban">' +
      col("대기", "wait", m.waiting, "w", "대기 중인 카드가 없어요.") +
      col("진행 중", "doing", m.doing, "d", "진행 중인 카드가 없어요.") +
      col("완료", "done", m.done, "c", "완료 처리된 카드가 아직 없어요. 진행 중 " + m.doing.length + "건이 순항하고 있어요.",
          { foldable: m.done.length > 4, foldLabel: "완료 목록" }) +
    '</div>';
    return panelWrap("kanban", "오늘 일의 흐름을 한눈에 봐요. 읽기 전용이라 드래그는 없고, 티켓을 누르면 상세가 모달로 열려요.", fbar + board);
  }

  // ── 기록 탭 (2단: 폴더 토글 트리 | 리딩 페인) ──────────────
  function renderRecords() {
    var tree = records.tree || {};
    var tnotes = tree.notes || {};
    var tprojects = tree.projects || {};
    var slugs = Object.keys(tprojects);
    var recent = (records.recent || []).slice(0, 5);
    var KIND_ICON = { md: "▤", table: "▦" };

    // 전 파일 메타 색인 (경로 → {title,date,kind,folderKey}) — 트리가 folder 를 확정
    var fileMeta = {};
    recent.forEach(function (f) { if (f && f.path && !fileMeta[f.path]) fileMeta[f.path] = { title: f.title, date: f.date, kind: f.kind, fk: recFolderKeyOf(f.path) }; });
    REC_ORDER.forEach(function (k) { (tnotes[k] || []).forEach(function (f) { if (f && f.path) fileMeta[f.path] = { title: f.title, date: f.date, kind: f.kind, fk: k }; }); });
    slugs.forEach(function (sl) { (tprojects[sl] || []).forEach(function (f) { if (f && f.path) fileMeta[f.path] = { title: f.title, date: f.date, kind: f.kind, fk: "proj:" + sl }; }); });

    // 선택 상태: file = 리딩 페인, openFolder = 펼친 폴더(단일·아코디언, null=접힘)
    var curFile = recView.file;
    if (curFile && !fileMeta[curFile] && !contentByPath[curFile]) curFile = null; // 갱신으로 사라진 경로 방어
    var openFolder = recView.folder;
    var selFolder = curFile ? recFolderKeyOf(curFile) : null;

    // ── 좌: 폴더 토글 트리 ──
    // 최근 (출처 라벨 포함) — 노트/산출물 혼재를 라벨로 구분
    var recentHTML = "";
    if (recent.length) {
      recentHTML = '<div class="rec-group"><div class="rec-nav-head">최근</div><ul class="rec-recent">' +
        recent.map(function (f) {
          var sel = f.path === curFile, src = recSrcLabel(recFolderKeyOf(f.path));
          return '<li><button class="rec-recent-row' + (sel ? ' sel' : '') + '" type="button" data-rec-file="' + esc(f.path) + '"' + (sel ? ' aria-current="true"' : '') + '>' +
            '<span class="rec-kind" aria-hidden="true">' + (KIND_ICON[f.kind] || "▤") + '</span>' +
            '<span class="rec-rmain"><span class="rec-name">' + esc(f.title) + '</span>' +
              (src ? '<span class="rec-src">' + esc(src) + '</span>' : '') + '</span>' +
            '<span class="rec-date">' + esc(ymd(f.date)) + '</span></button></li>';
        }).join("") + '</ul></div>';
    }

    // 폴더 행 (헤더 = 토글, 펼치면 하위 파일 인라인)
    function folderRow(key, label, files) {
      var open = openFolder === key;
      var hasSel = !open && selFolder === key; // 접혀 있어도 선택 파일이 이 폴더면 '여기 있음' 표시
      var head = '<button class="rec-nav-item' + (open ? ' open' : '') + (hasSel ? ' has-sel' : '') + '" type="button" data-rec-folder="' + esc(key) + '" aria-expanded="' + (open ? 'true' : 'false') + '">' +
        '<span class="rec-tw" aria-hidden="true">›</span>' +
        '<span class="lbl">' + esc(label) + '</span>' +
        '<span class="cnt">' + files.length + '</span></button>';
      var kids = "";
      if (open) {
        kids = files.length
          ? '<ul class="rec-files" role="group">' + files.map(function (f) {
              var sel = f.path === curFile;
              return '<li><button class="rec-file-row' + (sel ? ' sel' : '') + '" type="button" data-rec-file="' + esc(f.path) + '"' + (sel ? ' aria-current="true"' : '') + '>' +
                '<span class="rec-kind" aria-hidden="true">' + (KIND_ICON[f.kind] || "▤") + '</span>' +
                '<span class="rec-name">' + esc(f.title) + '</span>' +
                '<span class="rec-date">' + esc(ymd(f.date)) + '</span></button></li>';
            }).join("") + '</ul>'
          : '<div class="empty" style="padding:var(--g-space-4) var(--g-space-3)"><span class="em">🗂️</span>아직 기록이 없어요.</div>';
      }
      return '<div class="rec-folder">' + head + kids + '</div>';
    }

    var notesHTML = '<div class="rec-group"><div class="rec-nav-head">노트</div>' +
      REC_ORDER.map(function (k) { return folderRow(k, FOLDER_LABEL[k] || k, tnotes[k] || []); }).join("") + '</div>';
    var projHTML = slugs.length
      ? '<div class="rec-group"><div class="rec-nav-head">프로젝트 산출물</div>' +
          slugs.map(function (sl) { return folderRow("proj:" + sl, sl.replace(/^\d{4}-\d{2}-/, ""), tprojects[sl] || []); }).join("") + '</div>'
      : "";
    // ── 전문 검색: 질의가 있으면 폴더 아코디언 대신 **폴더를 가로지르는 결과 목록** 을 보여준다.
    //    (아코디언 단일 펼침 규약은 유지 — 여러 폴더를 동시에 봐야 하는 요구는 검색이 받는다)
    var q = recQuery.trim(), qLow = q.toLowerCase();
    var searchHTML = '<div class="rec-group" style="padding-bottom:var(--g-space-2)">' +
      '<span class="fsearch" style="max-width:none;display:block">' +
      '<input id="rec-q" type="search" placeholder="기록 전문 검색" value="' + esc(recQuery) + '" aria-label="기록 전문 검색" autocomplete="off">' +
      (q ? '<button class="fx" type="button" data-rf-clear aria-label="검색 지우기">✕</button>' : '') +
      '</span></div>';

    var treeInner;
    if (q) {
      var hits = allRecords().map(function (f) {
        var e = contentByPath[f.path] || {};
        var body = e.content ? String(e.content) : (e.table ? (e.table || []).map(function (r) { return (r || []).join(" "); }).join("\n") : "");
        var inTitle = String(f.title || "").toLowerCase().indexOf(qLow) >= 0;
        var bLow = body.toLowerCase(), inBody = bLow.indexOf(qLow) >= 0;
        if (!inTitle && !inBody) return null;
        var nHit = 0, at = 0, ix;
        while ((ix = bLow.indexOf(qLow, at)) >= 0) { nHit++; at = ix + qLow.length; }
        return { f: f, inTitle: inTitle, nHit: nHit, snip: inBody ? snippetOf(body, qLow) : "" };
      }).filter(Boolean).sort(function (a, b) {
        return (b.inTitle ? 1 : 0) - (a.inTitle ? 1 : 0) || b.nHit - a.nHit ||
          String(b.f.date || "").localeCompare(String(a.f.date || ""));
      });
      if (hits.length) {
        treeInner = '<div class="rec-group"><div class="rec-nav-head">검색 결과 · ' + hits.length + '건</div><ul class="rec-recent">' +
          hits.map(function (h) {
            var sel = h.f.path === curFile;
            return '<li><button class="rec-recent-row' + (sel ? ' sel' : '') + '" type="button" data-rec-file="' + esc(h.f.path) + '"' + (sel ? ' aria-current="true"' : '') + '>' +
              '<span class="rec-kind" aria-hidden="true">' + (KIND_ICON[h.f.kind] || "▤") + '</span>' +
              '<span class="rec-rmain"><span class="rec-name">' + hlm(h.f.title || basename(h.f.path), [q]) + '</span>' +
                '<span class="rec-src">' + esc(recSrcLabel(h.f.fk) || "") + (h.nHit ? ' · 본문 ' + h.nHit + '회' : '') + '</span>' +
                (h.snip ? '<span class="rec-src">' + hlm(h.snip, [q]) + '</span>' : '') + '</span>' +
              '<span class="rec-date">' + esc(ymd(h.f.date)) + '</span></button></li>';
          }).join("") + '</ul></div>';
      } else {
        treeInner = '<div class="empty rec-search-empty"><span class="em">🔍</span>‘' + esc(q) + '’ 가 들어간 기록이 없어요.<br>낱말을 줄여 보세요.</div>';
      }
    } else {
      treeInner = recentHTML + notesHTML + projHTML;
      var hasAny = recent.length || slugs.length || REC_ORDER.some(function (k) { return (tnotes[k] || []).length; });
      if (!hasAny) treeInner = '<div class="empty"><span class="em">🗂️</span>아직 쌓인 기록이 없어요.<br>텔레그램에서 파트너에게 말을 걸면 여기에 채워져요.</div>';
    }
    var treeEl = '<aside class="card rec-tree" aria-label="기록 폴더">' + searchHTML + treeInner + '</aside>';

    // ── 우: 리딩 페인 (주인공) — 본문을 모달 없이 그 자리에서 렌더 ──
    var read;
    if (curFile) {
      var entry = contentByPath[curFile] || {};
      var meta = fileMeta[curFile] || {};
      var src = recSrcLabel(meta.fk), dt = meta.date ? ymd(meta.date) : "";
      var metaLine = (src ? esc(src) : "") + (src && dt ? " · " : "") + (dt ? esc(dt) : "");
      var heads = [];
      var body = entry.table ? tableHTML(entry.table, true)
        : entry.content ? '<div class="md-body">' + renderMarkdown(entry.content, heads, dirOf(curFile)) + '</div>'
        : '<div class="empty"><span class="em">📄</span>이 파일은 미리보기가 준비되지 않았어요.<br>‘파일로 이동’으로 원본을 여세요.</div>';
      // 목차 — 긴 노트에서 어디가 어디인지 보이게 (2단 이상일 때만)
      var tocHTML = "";
      var tocable = heads.filter(function (h) { return h.lv <= 3; });
      if (tocable.length >= 3) {
        tocHTML = '<nav class="toc" aria-label="이 문서 목차"><div class="toc-h">목차</div><ul>' +
          tocable.map(function (h) {
            return '<li><a class="' + (h.lv >= 3 ? "d2" : "") + '" href="#' + h.id + '">' + esc(h.text) + '</a></li>';
          }).join("") + '</ul></nav>';
      }
      // 백링크 — 이 기록을 참조하는 할 일·프로젝트 + 같은 폴더의 형제 산출물.
      // 역방향 링크는 폴더 구조로 표현할 수 없다 → 이 화면이 파일 탐색기를 이기는 지점.
      var bl = backlinksOf(curFile), sib = siblingsOf(curFile);
      var blHTML = "";
      if (bl.length || sib.length) {
        var chips = bl.map(function (x) {
          if (x.k === "todo") {
            return '<button class="xlink" type="button" data-todo-jump="' + esc(x.v) + '">' +
              '<span class="ic" aria-hidden="true">☑</span><span class="tx">' + esc(x.t) + '</span></button>';
          }
          return '<button class="xlink" type="button" data-project-open="' + esc(x.v) + '">' +
            '<span class="ic" aria-hidden="true">◐</span><span class="tx">' + esc(x.t) + '</span></button>';
        }).concat(sib.map(function (f) {
          return '<button class="xlink" type="button" data-rec-file="' + esc(f.path) + '">' +
            '<span class="ic" aria-hidden="true">▤</span><span class="tx">' + esc(f.title || basename(f.path)) + '</span></button>';
        })).join("");
        blHTML = '<div class="xlink-h">이 기록을 참조하는 곳 · ' + (bl.length + sib.length) + '건</div>' +
          '<div class="xlinks">' + chips + '</div>';
      }
      read = '<section class="card rec-read" aria-labelledby="rd-h">' +
        '<div class="rec-read-head"><div class="rec-read-id">' +
          '<span class="rec-read-kind" aria-hidden="true">' + (KIND_ICON[meta.kind] || "▤") + '</span>' +
          '<div class="rec-read-tt"><h2 class="rec-read-title" id="rd-h">' + esc(meta.title || entry.title || basename(curFile)) + '</h2>' +
            (metaLine ? '<span class="rec-read-meta">' + metaLine + '</span>' : '') + '</div>' +
        '</div>' +
        '<span class="acts">' +
          '<button class="g-btn g-btn--secondary g-btn--sm" type="button" data-copy="' + esc(curFile) + '" aria-label="경로 복사">⧉</button>' +
        '</span></div>' +
        (q ? '<div class="rec-hitline" id="rec-hitline"></div>' : '') +
        '<div class="rec-read-body' + (tocHTML ? " has-toc" : "") + '"><div id="rec-read-main" style="min-width:0">' + body + '</div>' + tocHTML + '</div>' +
        blHTML + '</section>';
    } else {
      read = '<section class="card rec-read"><div class="empty"><span class="em">📄</span>왼쪽에서 파일을 고르면 여기에 내용이 바로 보여요.</div></section>';
    }

  // 표 데이터(csv/xlsx 임베드) → GYEOL 표 (첫 행 = 헤더)
  // 표: sortable=true 면 머리글 클릭 정렬 + 행 검색바. 숫자면 수치 비교, 아니면 문자 비교.
  function tableHTML(rows, sortable) {
    if (!rows || !rows.length) return '<div class="empty"><span class="em">▦</span>표가 비어 있어요.</div>';
    var head = '<tr>' + rows[0].map(function (c, ci) {
      if (!sortable) return '<th>' + esc(c) + '</th>';
      var on = tableSort.col === ci;
      return '<th class="srt" data-sort="' + ci + '" role="button" tabindex="0"' +
        ' aria-sort="' + (on ? (tableSort.dir > 0 ? "ascending" : "descending") : "none") + '">' +
        esc(c) + (on ? '<span class="ar" aria-hidden="true">' + (tableSort.dir > 0 ? "▲" : "▼") + '</span>' : '') + '</th>';
    }).join("") + '</tr>';
    var data = rows.slice(1);
    if (sortable && tableSort.col >= 0) {
      var ci2 = tableSort.col, dir = tableSort.dir;
      data = data.slice().sort(function (a, b) {
        var x = a[ci2] == null ? "" : String(a[ci2]), y = b[ci2] == null ? "" : String(b[ci2]);
        var nx = parseFloat(x.replace(/[,\s원%]/g, "")), ny = parseFloat(y.replace(/[,\s원%]/g, ""));
        var both = !isNaN(nx) && !isNaN(ny);
        var r = both ? (nx - ny) : x.localeCompare(y, "ko");
        return dir > 0 ? r : -r;
      });
    }
    var body = data.map(function (r) {
      return '<tr>' + r.map(function (c) { return '<td class="g-num">' + esc(c) + '</td>'; }).join("") + '</tr>';
    }).join("");
    var bar = sortable
      ? '<div class="rec-tbl-bar"><span class="fsearch" style="max-width:220px">' +
        '<input id="rec-tbl-q" type="search" placeholder="표 안에서 찾기" aria-label="표 검색" autocomplete="off"></span>' +
        '<span class="fresult" id="rec-tbl-count">' + data.length + '행</span></div>'
      : "";
    return bar + '<div class="tbl-wrap"><table class="rec-table"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
  }
  // 표 검색: 행을 다시 그리지 않고 감춘다 — 입력 포커스를 지킨다
  function paintRecTable(q) {
    var tb = document.querySelector(".rec-read .rec-table tbody");
    if (!tb) return;
    var rows = tb.rows, needle = String(q || "").trim().toLowerCase(), shown = 0;
    for (var i = 0; i < rows.length; i++) {
      var hit = !needle || (rows[i].textContent || "").toLowerCase().indexOf(needle) >= 0;
      if (hit) { rows[i].removeAttribute("hidden"); shown++; } else { rows[i].setAttribute("hidden", ""); }
    }
    var c = document.getElementById("rec-tbl-count");
    if (c) c.innerHTML = needle ? '<b>' + shown + '</b>행 / 전체 ' + rows.length + '행' : rows.length + "행";
  }
  // 본문 일치 강조 — 렌더된 HTML 문자열을 건드리지 않고 **텍스트 노드만** 감싼다(태그 파손 방지)
  function highlightIn(rootEl, term) {
    if (!rootEl || !term) return 0;
    var needle = String(term).trim().toLowerCase();
    if (!needle) return 0;
    var walker = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT, null);
    var targets = [], n;
    while ((n = walker.nextNode())) {
      if (!n.nodeValue || n.nodeValue.toLowerCase().indexOf(needle) < 0) continue;
      if (n.parentNode && n.parentNode.nodeName === "MARK") continue;
      targets.push(n);
    }
    var count = 0;
    targets.forEach(function (node) {
      var text = node.nodeValue, low = text.toLowerCase(), frag = document.createDocumentFragment(), at = 0, idx;
      while ((idx = low.indexOf(needle, at)) >= 0) {
        if (idx > at) frag.appendChild(document.createTextNode(text.slice(at, idx)));
        var mk = document.createElement("mark");
        mk.className = "hit";
        mk.textContent = text.slice(idx, idx + needle.length);
        frag.appendChild(mk);
        at = idx + needle.length;
        count++;

      if (at < text.length) frag.appendChild(document.createTextNode(text.slice(at)));
      node.parentNode.replaceChild(frag, node);

  // 노트 속 링크 → 웹뷰 모달 (일부 사이트는 임베드를 막는다 — 정직 안내 + 새 탭 폴백 상시 제공)

      '<a class="g-btn g-btn--secondary g-btn--sm" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">새 탭에서 열기 ↗</a></div>' +
      '<iframe class="webview" src="' + esc(url) + '" sandbox="allow-scripts allow-same-origin allow-forms allow-popups" referrerpolicy="no-referrer" title="웹 미리보기"></iframe>');
  }
  // ============================================================
  // W21 · 파트너 호출 (브리지) — 대시보드에서 시킨 일이 실행된다
  // ------------------------------------------------------------
  // 읽기 전용 계약은 유지된다: 대시보드가 파일을 쓰는 게 아니라 **에이전트에게 요청만** 보낸다.
  // 작성자는 여전히 에이전트 하나(STATE_CONTRACT 단일 작성자).
  // 브리지가 없으면(file:// 더블클릭) 같은 문장을 복사해 텔레그램에 붙일 수 있게 폴백한다.
  // ============================================================
  var BRIDGE = (function () {
    try { return window.__DASH_BRIDGE__ || null; } catch (e) { return null; }
  })();
  function partnerReady() { return !!(BRIDGE && BRIDGE.token && BRIDGE.claude); }

  var runnerEl, runnerBody, runnerTitle, runnerFoot, runnerPromptEl, runnerReply, runnerInput;
  var runnerAbort = null, runnerSession = null;
  function runnerInit() {
    runnerEl = document.getElementById("runner");
    runnerBody = document.getElementById("runner-body");
    runnerTitle = document.getElementById("runner-title");
    runnerFoot = document.getElementById("runner-foot");
    runnerPromptEl = document.getElementById("runner-prompt");
    runnerReply = document.getElementById("runner-reply");
    runnerInput = document.getElementById("runner-input");
  }
  function runnerOpen(title, prompt) {
    if (!runnerEl) runnerInit();
    runnerEl.removeAttribute("hidden");
    runnerEl.className = "runner busy";
    runnerTitle.textContent = title;
    runnerPromptEl.textContent = prompt;
    runnerBody.textContent = "";
    runnerFoot.innerHTML = "";

  }
  function runnerClose() {
    if (runnerAbort) { try { runnerAbort.abort(); } catch (e) {} runnerAbort = null; }
    if (runnerEl) runnerEl.setAttribute("hidden", "");
  }
  function runnerWrite(txt) {
    if (!runnerBody) return;

    runnerBody.textContent += txt;
    if (atBottom) runnerBody.scrollTop = runnerBody.scrollHeight;
  }

    if (!runnerEl) return;
    runnerEl.className = "runner " + state;

    if (runnerReply && runnerSession && state === "done") {
      runnerReply.removeAttribute("hidden");
      try { runnerInput.focus(); } catch (e) {}
    }
    var html = '<button class="g-btn g-btn--secondary g-btn--sm" type="button" data-runner-close>닫기</button>';
    // 파트너가 상태를 바꿨을 수 있다 — 화면을 새로 읽는 길을 준다(서버 모드는 폴링이 알아서 잡지만
    // 기다리지 않고 바로 보고 싶을 때가 있다).
    if (changed !== false) {
      html += '<button class="g-btn g-btn--soft g-btn--sm" type="button" data-runner-refresh>화면 갱신</button>';
    }
    runnerFoot.innerHTML = html;
  }

  // 파트너에게 일을 시킨다. title = 사람이 읽는 제목, prompt = 실제로 보내는 말(항상 열어볼 수 있음).
  function askPartner(title, prompt) {
    if (!partnerReady()) { fallbackCopy(title, prompt); return; }
    runnerSession = null;
    runnerOpen(title, prompt);
    sendToPartner(prompt);
  }
  // 이어가기 — 같은 세션으로 답을 보낸다
  function replyToPartner(text) {
    if (!partnerReady() || !runnerSession) return;
    if (runnerReply) runnerReply.setAttribute("hidden", "");
    runnerEl.className = "runner busy";
    runnerFoot.innerHTML = "";
    runnerWrite("\n\n> " + text + "\n\n");
    sendToPartner(text, runnerSession);
  }
  function sendToPartner(prompt, session) {
    var ctrl = null;
    try { ctrl = new AbortController(); runnerAbort = ctrl; } catch (e) {}
    fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Dashboard-Token": BRIDGE.token },
      body: JSON.stringify({ prompt: prompt, session: session || "" }),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (res) {
      try { runnerSession = res.headers.get("X-Session-Id") || runnerSession; } catch (e) {}
      if (!res.ok) {
        return res.json().then(function (j) { throw new Error(j.error || ("HTTP " + res.status)); },
                               function () { throw new Error("HTTP " + res.status); });
      }
      if (!res.body || !res.body.getReader) {          // 스트리밍 미지원 브라우저 폴백
        return res.text().then(function (t) { runnerWrite(t); runnerFinish("done"); });
      }
      var reader = res.body.getReader(), dec = new TextDecoder();
      return (function pump() {
        return reader.read().then(function (r) {
          if (r.done) { runnerFinish("done"); return; }
          runnerWrite(dec.decode(r.value, { stream: true }));
          return pump();
        });
      })();
    }).catch(function (e) {
      if (e && e.name === "AbortError") return;
      runnerWrite("\n[실패] " + (e && e.message ? e.message : e) + "\n");
      runnerFinish("fail", false);
    });
  }

  function runnerSend() {
    if (!runnerInput) return;
    var v = (runnerInput.value || "").trim();
    if (!v) return;
    runnerInput.value = "";
    replyToPartner(v);
  }

  // 브리지가 없을 때(file:// 더블클릭) — 같은 말을 복사해 텔레그램에 붙이면 결과는 같다.
  function fallbackCopy(title, prompt) {
    if (!runnerEl) runnerInit();
    runnerEl.removeAttribute("hidden");
    runnerEl.className = "runner";
    runnerTitle.textContent = title;
    runnerPromptEl.textContent = prompt;
    runnerBody.textContent =
      "이 화면은 파일을 더블클릭해서 연 상태라 파트너를 직접 부를 수 없어요.\n\n" +
      "아래 ‘문장 복사’ 를 눌러 텔레그램에 그대로 붙여넣으면 똑같이 처리됩니다.\n" +
      "터미널에서 ./dashboard.sh 로 열면 여기서 바로 실행할 수 있어요.";
    runnerFoot.innerHTML =
      '<button class="g-btn g-btn--soft g-btn--sm" type="button" data-copy="' + esc(prompt) + '">문장 복사</button>' +
      '<button class="g-btn g-btn--secondary g-btn--sm" type="button" data-runner-close>닫기</button>';
  }

  // 행동 버튼 한 줄 만들기 — 브리지가 없으면 라벨을 정직하게 바꾼다(없는 기능을 약속하지 않는다).
  function partnerActions(label, items) {
    if (!items.length) return "";
    var btns = items.map(function (it) {
      return '<button class="pbtn" type="button" data-ask="' + esc(it.id) + '" data-ask-arg="' + esc(it.arg || "") + '">' +
        '<span class="ic" aria-hidden="true">' + (it.ic || "◆") + '</span>' + esc(it.label) + '</button>';
    }).join("");
    var note = partnerReady() ? ""
      : '<div class="partner-off">지금은 문장 복사만 돼요 — <code>./dashboard.sh</code> 로 열면 여기서 바로 실행됩니다.</div>';
    return '<div class="acts-partner">' + (label ? '<span class="lbl">' + esc(label) + '</span>' : '') + btns + '</div>' + note;
  }

  // ── 행동 사전 ──────────────────────────────────────────────
  // 화면의 버튼 하나 = 여기 한 줄. 프롬프트를 한곳에 모아 두는 이유:
  //   ① 무엇이 나가는지 검토·수정이 쉽다 ② 스킬 명세와 짝이 맞는지 대조하기 쉽다(정직 규율).
  // 각 항목의 skill 은 "이 행동이 기대는 제품 기능" — 명세에 없는 기능을 버튼으로 약속하지 않는다.
  var ASKS = {
    "todo.draft": {
      skill: "draft-writer",
      title: function (t) { return "답장 초안 — " + t.title; },
      prompt: function (t) {
        return "대시보드에서 요청합니다.\n\n" +
          "아래 할 일에 대한 답장/대응 초안을 내 말투로 잡아줘.\n" +
          "- 제목: " + t.title + "\n" +
          (t.source ? "- 원본 기록: " + t.source + "\n" : "") +
          (t.due ? "- 기한: " + t.due + "\n" : "") +
          "\n원본 기록을 먼저 읽고, 맥락에 맞는 초안을 제안해줘. 확정은 내가 한다.";
      }
    },
    "todo.done": {
      skill: "reminder · issue-tracker",
      title: function (t) { return "완료 처리 — " + t.title; },
      prompt: function (t) {
        return "대시보드에서 요청합니다.\n\n" +
          "아래 할 일을 완료 처리해줘.\n" +
          "- 제목: " + t.title + "\n" +
          (t.source ? "- 원본 기록: " + t.source + "\n" : "") +
          "\nstate/status.json 의 해당 항목 state 를 done 으로 바꾸고, " +
          "today.activities 에 한 줄 남긴 뒤 ./refresh-dashboard.sh 를 실행해줘. " +
          "해당 항목을 못 찾으면 바꾸지 말고 무엇을 못 찾았는지 알려줘.";
      }
    },
    "todo.defer": {
      skill: "reminder",
      title: function (t) { return "기한 미루기 — " + t.title; },
      prompt: function (t) {
        return "대시보드에서 요청합니다.\n\n" +
          "아래 할 일의 기한을 하루 뒤로 미뤄줘.\n" +
          "- 제목: " + t.title + "\n" +
          (t.due ? "- 지금 기한: " + t.due + "\n" : "") +
          "\nstate/status.json 의 due 를 하루 뒤로 바꾸고 ./refresh-dashboard.sh 를 실행해줘. " +
          "미루는 게 부적절해 보이면 그 이유를 먼저 말해줘.";
      }
    },
    "todo.context": {
      skill: "recall",
      title: function (t) { return "지난 맥락 찾기 — " + t.title; },
      prompt: function (t) {
        return "대시보드에서 요청합니다.\n\n" +
          "‘" + t.title + "’ 와 관련된 지난 기록을 notes/ 에서 찾아 요약해줘.\n" +
          (t.source ? "- 이 건의 원본: " + t.source + "\n" : "") +
          "\n비슷한 일이 전에 있었는지, 그때 어떻게 처리했는지 중심으로. 없으면 없다고 말해줘.";
      }
    }
  };

  function askIdRun(id, arg) {
    var spec = ASKS[id];
    if (!spec) return;
    var ctx = null;
    if (id.indexOf("todo.") === 0) {
      var t = todos[+arg];
      if (!t) { toast("그 항목을 찾지 못했어요"); return; }
      ctx = t;
    }
    if (!ctx) return;
    askPartner(spec.title(ctx), spec.prompt(ctx));
  }

  // 내부 링크 열기 — 기록 탭 리딩 페인으로 보낸다(모달이 아니라 위키처럼 그 자리에서 이어 읽기).
  // 모달(뷰어·티켓) 안에서 눌렀으면 모달을 닫고 기록 탭으로 넘긴다.
  function openInternal(path) {
    if (!path) return;
    if (modalOpen()) closeModal();
    recView.file = path;
    pushRecent(path);
    var fk = recFolderKeyOf(path);
    if (fk) recView.folder = fk;
    if (activeTab !== "records") { location.hash = "#records"; }
    else { paintView(); }
    if (SERVER_MODE && !hasBody(path)) {
      ensureBody(path, function (filled) { if (filled && recView.file === path) paintView(); });
    }
  }

  function openViewer(path) {
    // 서버 모드: 래퍼에 본문이 없으면 파일에서 바로 읽어 온 뒤 연다 (한 번만 재시도)
    if (SERVER_MODE && path && !hasBody(path)) {
      ensureBody(path, function (filled) { if (filled) openViewer(path); else openViewerNow(path); });
      return;
    }
    openViewerNow(path);
  }
  function openViewerNow(path) {
    pushRecent(path);                       // 팔레트의 '최근' 목록 재료
    var entry = contentByPath[path];
    var title = (entry && entry.title) ? entry.title : basename(path);
    var mdHtml = (entry && entry.table) ? tableHTML(entry.table)
      : (entry && entry.content) ? renderMarkdown(entry.content, null, dirOf(path))
      : '<div class="empty" style="padding:var(--g-space-7) var(--g-space-5)"><span class="em">📄</span>' +
        '이 파일은 미리보기가 준비되지 않았어요.<br>‘파일로 이동’으로 원본을 여세요.<br>' +
        '<span style="color:var(--g-fg-subtle)">텔레그램에서 파트너가 활동하면 자동으로 채워집니다.</span></div>';
    var foot = '<div class="md-foot"><code>' + esc(path) + '</code>' +
      '<button class="g-btn g-btn--secondary g-btn--sm" type="button" data-copy="' + esc(path) + '" aria-label="경로 복사">⧉ 복사</button></div>';
    openModal(title, '<div class="md-body">' + mdHtml + '</div>' + foot);
  }
  function openTicket(id) {
    var tk = ticketMap[id];
    if (!tk) return;
    var rows = "" +
      '<li><span class="tk-k">유형</span><span class="tk-v">' + esc(tk.type) + '</span></li>' +
      '<li><span class="tk-k">담당자</span><span class="tk-v">' + esc(tk.assignee) + '</span></li>' +
      '<li><span class="tk-k">상태</span><span class="tk-v">' + tk.statusChip + '</span></li>' +
      '<li><span class="tk-k">기한</span><span class="tk-v tnum">' + esc(tk.due) + '</span></li>';
    if (tk.source) {
      rows += '<li><span class="tk-k">출처 노트</span><span class="tk-v">' +
        '<div class="tk-src"><code>' + esc(tk.source) + '</code></div>' +
        '<div class="acts" style="margin-top:var(--g-space-3)">' +
          '<button class="g-btn g-btn--soft g-btn--sm" type="button" data-viewer="' + esc(tk.source) + '">보기</button>' +
          '<button class="g-btn g-btn--secondary g-btn--sm" type="button" data-copy="' + esc(tk.source) + '" aria-label="경로 복사">⧉</button>' +
        '</div></span></li>';
    }
    if (tk.related) {
      rows += '<li><span class="tk-k">관련 결과물</span><span class="tk-v">' +
        '<div class="tk-src"><code>' + esc(tk.related) + '</code></div>' +
        '<div class="acts" style="margin-top:var(--g-space-3)"><button class="g-btn g-btn--soft g-btn--sm" type="button" data-viewer="' + esc(tk.related) + '">보기</button></div></span></li>';
    }
    openModal(tk.title, '<ul class="tk-fields">' + rows + '</ul>');
  }

  // ============================================================
  // 커맨드 팔레트 (⌘K / Ctrl+K / ) — 이동 + 노트 전문 검색
  //   이 대시보드의 해자는 "에이전트가 남긴 것들이 서로 연결돼 있다" 는 점이다.
  //   폴더 탐색기는 본문을 가로질러 찾지 못한다 — 그 차이를 만드는 곳.
  // ============================================================
  var cmdkEl = document.getElementById("cmdk");
  var cmdkInput = document.getElementById("cmdk-input");
  var cmdkList = document.getElementById("cmdk-list");
  var cmdkCount = document.getElementById("cmdk-count");
  var cmdkCur = 0, cmdkRows = [], cmdkRelease = null, cmdkLastFocus = null;
  var CMDK_ICON = { 이동: "◈", "할 일": "☑", 프로젝트: "◐", 팀: "◎", 기록: "▤" };
  var RECENT_KEY = "bp-dash-recent";

  function recentPaths() {
    try { var a = JSON.parse(localStorage.getItem(RECENT_KEY) || "[]"); return Array.isArray(a) ? a : []; } catch (e) { return []; }
  }
  function pushRecent(path) {
    if (!path) return;
    try {
      var a = recentPaths().filter(function (p) { return p !== path; });
      a.unshift(path); localStorage.setItem(RECENT_KEY, JSON.stringify(a.slice(0, 8)));
    } catch (e) {}
  }

  // 색인은 부팅 때 한 번 만든다(데이터가 바뀌면 페이지가 리로드되므로 재구축 불필요)
  // 서버 모드에서 노트 본문을 뒤늦게 채우면 색인도 다시 세운다 → 함수로 분리(부팅 때 1회 호출).
  function buildCmdkIndex() {
    var idx = [];
    TABS.forEach(function (tb) {
      idx.push({ g: "이동", t: tb.label, sub: tb.label + " 탭으로 이동", kw: tb.label + " " + tb.id, act: { k: "tab", v: tb.id } });
    });
    todos.forEach(function (t) {
      var dd = ddayLabel(t);
      var stTxt = t.state === "done" ? "완료" : dd.txt;
      idx.push({
        g: "할 일", t: t.title, sub: (KIND_LABEL[t.kind] || t.kind) + " · " + stTxt,
        kw: t.title + " " + (KIND_LABEL[t.kind] || "") + " " + (t.source || ""),
        act: { k: "todo", v: t.source || "" }
      });
    });
    projectList.forEach(function (p) {
      idx.push({
        g: "프로젝트", t: p.goal,
        sub: p.done ? "완료" : ((p.phase ? p.phase + " 단계" : "진행 중") + (p.health ? " · " + p.health : "")),
        kw: p.goal + " " + (p.phase || ""), act: { k: "project", v: p.id }
      });
    });
    rosterRoles.forEach(function (r, i) {
      var st = staffForRole(r);
      idx.push({
        g: "팀", t: st ? (st.name + " — " + r.name) : r.name, sub: r.focus || "역할 카드",
        kw: (st ? st.name + " " + (st.mbti || "") + " " : "") + r.name + " " + (r.focus || ""),
        act: { k: "role", v: "ri-" + i }
      });
    });
    Object.keys(contentByPath).forEach(function (p) {
      var e = contentByPath[p] || {};
      idx.push({
        g: "기록", t: e.title || basename(p), sub: recSrcLabel(recFolderKeyOf(p)) || basename(p),
        kw: (e.title || "") + " " + p, body: e.content || "", act: { k: "record", v: p }
      });
    });
    return idx;
  }
  var CMDK_INDEX = buildCmdkIndex();

  function hl(text, terms) {
    var out = esc(String(text == null ? "" : text));
    terms.forEach(function (tm) {
      if (!tm) return;
      var re = new RegExp("(" + tm.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
      out = out.replace(re, '<mark class="cmdk-hit">$1</mark>');
    });
    return out;
  }
  // 본문에서만 걸린 경우 그 대목을 잘라 보여준다 — 왜 이 결과가 나왔는지 알 수 있게
  function snippetOf(body, term) {
    var low = body.toLowerCase(), i = low.indexOf(term);
    if (i < 0) return "";
    var from = Math.max(0, i - 26), to = Math.min(body.length, i + term.length + 44);
    return (from > 0 ? "…" : "") + body.slice(from, to).replace(/\s+/g, " ") + (to < body.length ? "…" : "");
  }

  function cmdkSearch(q) {
    var needle = String(q || "").trim().toLowerCase();
    if (!needle) {
      // 빈 질의 = 최근 열어본 것 + 탭 이동
      var rec = recentPaths().map(function (p) {
        var e = contentByPath[p]; if (!e) return null;
        return { it: { g: "최근", t: e.title || basename(p), sub: recSrcLabel(recFolderKeyOf(p)) || basename(p), act: { k: "record", v: p } }, terms: [], snip: "", score: 200 };
      }).filter(Boolean);
      var tabs = CMDK_INDEX.filter(function (x) { return x.g === "이동"; }).map(function (it) { return { it: it, terms: [], snip: "", score: 100 }; });
      return rec.concat(tabs);
    }
    var terms = needle.split(/\s+/).filter(Boolean);
    var out = [];
    CMDK_INDEX.forEach(function (it) {
      var hay = String(it.kw || "").toLowerCase();
      var body = String(it.body || "").toLowerCase();
      var score = 0, hitTitleAny = false;
      for (var i = 0; i < terms.length; i++) {
        var ti = hay.indexOf(terms[i]);
        var bi = ti < 0 ? body.indexOf(terms[i]) : -1;
        if (ti < 0 && bi < 0) return;            // 모든 낱말이 어딘가에 있어야 한다(AND)
        if (ti === 0) { score += 120; hitTitleAny = true; }
        else if (ti > 0) { score += 70; hitTitleAny = true; }
        else score += 18;                         // 본문만 일치
      }
      if (it.g === "이동") score += 30;            // 탭 이동은 위로
      out.push({ it: it, terms: terms, snip: hitTitleAny ? "" : snippetOf(String(it.body || ""), terms[0]) });
      out[out.length - 1].score = score;
    });
    out.sort(function (a, b) { return b.score - a.score || String(a.it.t).length - String(b.it.t).length; });
    return groupContiguous(out.slice(0, 40));
  }

  // 같은 머리글이 두 번 나오지 않게 그룹을 붙인다. 그룹 순서는 그 그룹의 최고 점수 순 —
  // 가장 잘 맞는 항목이 여전히 첫 줄이고(Enter 기본값), 머리글은 한 번씩만 나온다.
  function groupContiguous(rows) {
    var byG = {}, order = [];
    rows.forEach(function (r) {
      var g = r.it.g;
      if (!byG[g]) { byG[g] = []; order.push(g); }
      byG[g].push(r);
    });
    order.sort(function (a, b) { return (byG[b][0].score || 0) - (byG[a][0].score || 0); });
    var flat = [];
    order.forEach(function (g) { flat = flat.concat(byG[g]); });
    return flat;
  }

  function cmdkRender(q) {
    var res = cmdkSearch(q);
    cmdkRows = res;
    if (!res.length) {
      cmdkList.innerHTML = '<div class="cmdk-empty"><span class="em" aria-hidden="true">⌕</span>' +
        '찾는 게 없어요. 노트 <b>본문</b>까지 찾으니 단어를 하나만 넣어보세요.</div>';
      cmdkCount.textContent = "0건";
      cmdkInput.setAttribute("aria-activedescendant", "");
      return;
    }
    if (cmdkCur >= res.length) cmdkCur = res.length - 1;
    if (cmdkCur < 0) cmdkCur = 0;
    var html = "", lastG = null;
    res.forEach(function (r, i) {
      if (r.it.g !== lastG) { html += '<div class="cmdk-group-h">' + esc(r.it.g) + '</div>'; lastG = r.it.g; }
      var sel = i === cmdkCur;
      html += '<button class="cmdk-item" role="option" id="cmdk-o-' + i + '" type="button" data-cmdk-run="' + i + '"' +
        ' aria-selected="' + (sel ? "true" : "false") + '">' +
        '<span class="cmdk-kind" aria-hidden="true">' + (CMDK_ICON[r.it.g] || "▤") + '</span>' +
        '<span class="cmdk-main"><span class="cmdk-t">' + hl(r.it.t, r.terms) + '</span>' +
        (r.snip ? '<span class="cmdk-snip">' + hl(r.snip, r.terms) + '</span>'
                : (r.it.sub ? '<span class="cmdk-sub">' + esc(r.it.sub) + '</span>' : '')) +
        '</span></button>';
    });
    cmdkList.innerHTML = html;
    cmdkCount.textContent = res.length + "건";
    cmdkInput.setAttribute("aria-activedescendant", "cmdk-o-" + cmdkCur);
    var cur = document.getElementById("cmdk-o-" + cmdkCur);
    if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "nearest" });
  }

  function cmdkOpen() {
    if (!cmdkEl || !cmdkEl.hasAttribute("hidden")) return;
    cmdkLastFocus = document.activeElement;
    cmdkEl.removeAttribute("hidden");
    cmdkInput.value = ""; cmdkCur = 0;
    cmdkRender("");
    if (typeof G !== "undefined" && G.trap) { try { cmdkRelease = G.trap(cmdkEl.querySelector(".cmdk")); } catch (e) {} }
    try { cmdkInput.focus(); } catch (e) {}
  }
  function cmdkOpened() { return cmdkEl && !cmdkEl.hasAttribute("hidden"); }
  function cmdkClose() {
    if (!cmdkOpened()) return;
    cmdkEl.setAttribute("hidden", "");
    cmdkList.innerHTML = "";
    if (cmdkRelease) { try { cmdkRelease(); } catch (e) {} cmdkRelease = null; }
    if (cmdkLastFocus && cmdkLastFocus.focus && cmdkLastFocus.isConnected) { try { cmdkLastFocus.focus(); } catch (e) {} }
    cmdkLastFocus = null;
  }
  function cmdkMove(delta) {
    if (!cmdkRows.length) return;
    cmdkCur = (cmdkCur + delta + cmdkRows.length) % cmdkRows.length;
    cmdkRender(cmdkInput.value);
  }
  function cmdkRun(i) {
    var r = cmdkRows[i];
    if (!r) return;
    var a = r.it.act;
    cmdkClose();
    if (!a) return;
    if (a.k === "tab") { location.hash = "#" + a.v; return; }
    if (a.k === "todo") {
      if (location.hash.replace(/^#/, "") !== "todos") { location.hash = "#todos"; }

      var idx = TABS.map(function (x) { return x.id; }).indexOf(activeTab);
      if (e.key === "ArrowDown" || e.key === "ArrowRight") { e.preventDefault(); location.hash = "#" + TABS[(idx + 1) % TABS.length].id; }
      else if (e.key === "ArrowUp" || e.key === "ArrowLeft") { e.preventDefault(); location.hash = "#" + TABS[(idx - 1 + TABS.length) % TABS.length].id; }
      else if (e.key === "Home") { e.preventDefault(); location.hash = "#" + TABS[0].id; }
      else if (e.key === "End") { e.preventDefault(); location.hash = "#" + TABS[TABS.length - 1].id; }
    }
  });

  // ============================================================
  // W20 3단계 · 서버 모드 — state/*.json 직접 읽기 + 노트 본문 지연 로드
  // ------------------------------------------------------------
  // 파일 모드(file://)는 CORS 때문에 fetch 가 막혀 래퍼만 쓴다. 서버 모드에서만 아래가 켜진다.
  // 실패하면 조용히 래퍼 값으로 남는다(폴백 우선 — 서버가 없어도 지금까지처럼 동작한다).
  // ============================================================

  // status/team 만 새로 들어온다(records·roster 는 파일시스템 스캔이 필요해 래퍼 소관).
  // 그래서 여기서 다시 계산해야 하는 파생값을 **한곳에** 모아 둔다 — 빠뜨리면 화면 일부만 낡는다.
  function applyStatusTeam(freshStatus, freshTeam) {
    if (freshStatus) { data.status = freshStatus; s = freshStatus; }
    if (freshTeam) { data.team = freshTeam; team = freshTeam; }

    agent = s.agent || {}; today = s.today || {}; tcounts = today.counts || {};
    todos = s.todos || [];
    proj = team.activeProject || null;

    TODAY = (today && today.date) || isoToday();
    REAL_TODAY = isoToday();
    dataStale = TODAY !== REAL_TODAY;
    staleDays = (function () { var a = parseD(REAL_TODAY), b = parseD(TODAY); return (a && b) ? Math.round((a - b) / 86400000) : 0; })();

    activeTodos = todos.filter(function (t) { return t.state !== "done"; });
    overdueN = countBucket("past"); todayN = countBucket("today"); laterN = countBucket("later");

    staffList = (team && team.staff) || [];
    staffById = {}; staffByName = {}; staffByRole = {};
    staffList.forEach(function (st) {
      if (st.roleFile) staffById[st.roleFile] = st;
      if (st.name) staffByName[st.name] = st;
      if (st.role) staffByRole[st.role] = st;
    });

    projectList = [];
    if (proj) projectList.push(normProject(proj, false, 0));
    (team.pipeline || []).forEach(function (p, i) { projectList.push(normProject(p, false, i + 1)); });
    (team.history || []).forEach(function (h, i) { projectList.push(normProject(h, true, i)); });
    projectList.forEach(function (p) {
      (p.outputs || []).forEach(function (o) { if (o && !hasBody(o.path)) putBody(o.path, o.title, o.content, null); });
    });

    // 프로젝트 상세 화면이 사라진 프로젝트를 가리키고 있으면 목록으로 되돌린다
    if (projectView.mode === "detail") {
      var found = false;
      projectList.forEach(function (p) { if (p.id === projectView.id) found = true; });
      if (!found) projectView = { mode: "list", id: null };
    }
    CMDK_INDEX = buildCmdkIndex();
  }

  function fetchJSON(path) {
    return fetch("../" + path + "?v=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.json(); });
  }

  // 두 상태 파일을 직접 읽어 반영한다. 하나라도 실패하면 아무것도 바꾸지 않는다(반쪽 반영 금지).
  function loadLiveState(done) {
    Promise.all([fetchJSON("state/status.json"), fetchJSON("state/team.json")])
      .then(function (r) {
        srvLive = true;
        applyStatusTeam(r[0], r[1]);
        done();
      })
      .catch(function () { srvLive = false; done(); });
  }

  // ── 노트 본문 지연 로드 ─────────────────────────────────────
  // 래퍼에 본문이 없어도(대용량 금고에서 임베드를 줄인 경우) 파일에서 바로 읽어 보여준다.
  var bodyFetching = {};
  function parseCsvText(txt) {
    var rows = [], row = [], cell = "", q = false, i = 0;
    var t = String(txt).replace(/\r\n/g, "\n").replace(/\r/g, "\n");
    for (; i < t.length; i++) {
      var ch = t.charAt(i);
      if (q) {
        if (ch === '"') { if (t.charAt(i + 1) === '"') { cell += '"'; i++; } else q = false; }
        else cell += ch;
      } else if (ch === '"') q = true;
      else if (ch === ",") { row.push(cell); cell = ""; }
      else if (ch === "\n") { row.push(cell); cell = ""; rows.push(row); row = []; if (rows.length >= 200) break; }
      else cell += ch;
    }
    if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
    return rows.length ? rows : null;
  }
  // done(true) = 새로 채워졌음 / done(false) = 이미 있거나 가져올 수 없음
  function ensureBody(path, done) {
    if (!path || hasBody(path) || !SERVER_MODE || bodyFetching[path]) { done(false); return; }
    if (/\.xlsx$/i.test(path)) { done(false); return; }   // xlsx 는 브라우저에서 못 푼다 — 래퍼 파싱 결과만 쓴다
    bodyFetching[path] = 1;
    fetch("../" + path, { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.text(); })
      .then(function (txt) {
        var title = basename(path).replace(/\.(md|csv)$/i, "").replace(/^\d{4}-\d{2}-\d{2}-/, "");
        if (/\.csv$/i.test(path)) {
          var tbl = parseCsvText(txt);
          if (tbl) putBody(path, title, null, tbl); else putBody(path, title, txt, null);
        } else {
          putBody(path, title, txt, null);
        }
        delete bodyFetching[path];
        done(true);
      })
      .catch(function () { delete bodyFetching[path]; done(false); });
  }

  // 검색이 반쪽이 되지 않게, 본문 없는 파일을 조용히 뒤에서 채운다(동시 3개까지).
  function backfillBodies() {
    if (!SERVER_MODE) return;
    var missing = allRecords().filter(function (f) { return f.path && !hasBody(f.path) && !/\.xlsx$/i.test(f.path); })
      .map(function (f) { return f.path; });
    if (!missing.length) return;
    var at = 0, live = 0, changed = false;
    function pump() {
      while (live < 3 && at < missing.length) {
        live++;
        ensureBody(missing[at++], function (ok2) {
          if (ok2) changed = true;
          live--;
          if (at < missing.length) pump();
          else if (live === 0 && changed) {
            CMDK_INDEX = buildCmdkIndex();
            if (activeTab === "records") paintView();
          }
        });
      }
    }
    pump();
  }

  // ── 부팅 ───────────────────────────────────────────────────
  function boot() {
    activeTab = tabFromHash();
    renderAll();
    backfillBodies();
    startPolling();
  }

  // "갱신 N초 전" 라벨을 1초마다 갱신 (전체 리로드 없이 표시만 최신화)
  setInterval(function () {
    var label = "갱신 " + relTime(s.updatedAt);
    var els = document.querySelectorAll ? document.querySelectorAll(".upd-label") : [];
    for (var i = 0; i < els.length; i++) els[i].textContent = label;
  }, 1000);

  // 데이터 갱신 감지 — 매 15초 전체 리로드는 스크롤·펼침 상태를 깨서 불편하다는 대표 피드백으로 교체.
  // 바뀐 경우에만 갱신한다. (보존 계약: 무조건 리로드로 되돌리지 말 것)
  //  · 파일 모드: 래퍼를 다시 읽어 서명이 바뀌면 리로드.
  //  · 서버 모드: state/*.json 만 읽어 서명이 바뀌면 **리로드 없이 제자리 갱신** — 스크롤·펼침이 유지된다.
  function dataSig(d) { d = d || {}; return ((d.status || {}).updatedAt || "") + "|" + ((d.team || {}).updatedAt || ""); }
  var bootSig = dataSig(data);
  var POLL_MS = 15000;

  function pollServer() {
    setTimeout(function () {
      if (modalOpen() || cmdkOpened()) { pollServer(); return; }   // 노트 읽는 중·검색 중엔 건드리지 않는다
      Promise.all([fetchJSON("state/status.json"), fetchJSON("state/team.json")])
        .then(function (r) {
          srvLive = true;
          var sig = dataSig({ status: r[0], team: r[1] });
          if (sig !== bootSig) {
            bootSig = sig;
            applyStatusTeam(r[0], r[1]);
            renderAll();
            backfillBodies();
            toast("새 소식이 있어 화면을 갱신했어요");
          }
          pollServer();
        })
        .catch(function () { srvLive = false; pollServer(); });
    }, POLL_MS);
  }

  function pollFile() {
    setTimeout(function () {
      if (modalOpen()) { pollFile(); return; }
      var sc = document.createElement("script");
      sc.src = "../state/dashboard-data.js?v=" + Date.now();
      sc.onload = function () {
        sc.remove();
        if (dataSig(window.DASHBOARD_DATA) !== bootSig) { location.reload(); return; }
        pollFile();
      };
      sc.onerror = function () { sc.remove(); pollFile(); };
      document.head.appendChild(sc);
    }, POLL_MS);
  }

  function startPolling() { if (SERVER_MODE) pollServer(); else pollFile(); }

  // 서버 모드면 상태 파일을 먼저 직접 읽고 그린다 — 첫 화면부터 최신이 되도록.
  // (래퍼가 낡아 있어도 홈·할 일·프로젝트·팀·칸반은 실시간 값으로 뜬다)
  if (SERVER_MODE) {
    loadLiveState(function () { bootSig = dataSig(data); boot(); });
  } else {
    boot();
  }
})();
</script>
</body>
</html>
